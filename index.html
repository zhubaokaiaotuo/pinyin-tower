      var cell = gridEl.children[i];
      if (!cell) return;
      cell.style.animationDelay = (n * 35) + 'ms';
      cell.classList.add('drop');
    });
  }

  /* 把待落队列一次铺进空位 */
  function flushPending() {
    var filled = [];
    while (pending.length) {
      var slot = -1;
      for (var i = 0; i < 8; i++) { if (!cards[i]) { slot = i; break; } }
      if (slot < 0) break;
      cards[slot] = pending.shift();
      filled.push(slot);
    }
    return filled;
  }

  /* 空位直接生一张新卡：尽量补成能拼成音节的字母 */
  function topUp() {
    var empties = [];
    for (var i = 0; i < 8; i++) { if (!cards[i]) empties.push(i); }
    if (!empties.length) return [];

    /* 组词喂字：拼满 5 轮后，有机会把一整个「能和我方字格组词」的音节铺上桌 */
    var feedLetters = null;
    if (runChars.length >= 5 && myCells.some(Boolean) && Math.random() < 0.62) {
      var fe = wordFeedEntry([]);
      if (fe) {
        feedLetters = [fe.s];
        if (fe.m) feedLetters.push(fe.m);
        feedLetters.push(fe.y);
        var onBoard = [];
        for (var i0 = 0; i0 < 8; i0++) if (cards[i0]) onBoard.push(cards[i0].v);
        feedLetters = feedLetters.filter(function (x) { return onBoard.indexOf(x) < 0; });
        /* 空位不够铺下整个音节，或只剩一个字母拼不成，都不浪费 */
        if (feedLetters.length < 2 || feedLetters.length > empties.length) feedLetters = null;
      }
    }

    var feedN = feedLetters ? feedLetters.length : 0;
    empties.forEach(function (slot, idx) {
      var v = null;
      if (idx < feedN) {
        v = feedLetters[idx];   /* 喂字：按音节顺序铺满空位 */
      } else
      /* 七成机会挑一个能跟场上某个字母拼成音节的搭档 */
      if (Math.random() < 0.7) {
        var idxs = [];
        for (var i = 0; i < 8; i++) { if (cards[i]) idxs.push(i); }
        if (idxs.length) {
          var base = cards[pick(idxs)].v;
          var mate = [];
          DB.forEach(function (w) {
            var need = [w.s];
            if (w.m) need.push(w.m);
            need.push(w.y);
            if (need.indexOf(base) < 0) return;
            need.forEach(function (x) { if (x !== base && mate.indexOf(x) < 0) mate.push(x); });
          });
          if (mate.length) v = pick(mate);
        }
      }
      if (!v) v = Math.random() < 0.45 ? pick(SHENGMU) : pick(YUNMU);
      cards[slot] = { v: v, kind: kindOf(v), id: newId() };
    });

    var tgt = currentTarget();
    if (tgt) ensureLetters(tgt);
    return empties;
  }

  function hasSolution() {
    var idx = [];
    for (var i = 0; i < 8; i++) if (cards[i]) idx.push(i);
    for (var a = 0; a < idx.length; a++) {
      for (var b = a + 1; b < idx.length; b++) {
        var k2 = [cards[idx[a]].v, cards[idx[b]].v].sort().join('|');
        if (KEYMAP[k2] || HOMO[k2]) return true;
        for (var c = b + 1; c < idx.length; c++) {
          var k3 = [cards[idx[a]].v, cards[idx[b]].v, cards[idx[c]].v].sort().join('|');
          if (KEYMAP[k3] || HOMO[k3]) return true;
        }
      }
    }
    return false;
  }

  /* 整盘都拼不出字时，只换掉一张多余卡凑出一个音节，不推倒重来 */
  function forcePair() {
    var have = {};
    for (var i = 0; i < 8; i++) { if (cards[i]) have[cards[i].v] = (have[cards[i].v] || 0) + 1; }
    var cand = [];
    DB.forEach(function (w) {
      var need = [w.s];
      if (w.m) need.push(w.m);
      need.push(w.y);
      var miss = need.filter(function (x) { return !have[x]; });
      if (miss.length === 1) cand.push(miss[0]);
    });
    if (!cand.length) return false;
    var pool = [];
    for (var k = 0; k < 8; k++) { if (cards[k] && sel.indexOf(k) < 0) pool.push(k); }
    if (!pool.length) return false;
    var slot = pick(pool);
    var v = pick(cand);
    cards[slot] = { v: v, kind: kindOf(v), id: newId() };
    renderGrid(false);
    markDrop([slot]);
    return true;
  }

  function refill() {
    if (pending.length) return;
    var tgt = currentTarget();
    if (tgt) ensureLetters(tgt);
    if (hasSolution()) return;
    if (forcePair()) return;
    var empty = 0;
    for (var i = 0; i < 8; i++) { if (!cards[i]) empty++; }
    if (empty >= 4) {
      tipEl.textContent = '补一批字母';
      newWave();
    } else {
      tipEl.textContent = '这一批拼完了，换一批';
      setTimeout(function () {
        if (st.mode === MODE.PLAY) fullReset();
      }, 420);
    }
  }

  /* =====================================================================
     六、渲染：字母卡 + 双方字格
     ===================================================================== */
  var gridEl = document.getElementById('grid');
  var myGridEl = document.getElementById('myGrid');
  var foeGridEl = document.getElementById('foeGrid');

  function renderGrid(anim) {
    gridEl.innerHTML = '';
    for (var i = 0; i < 8; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var c = cards[i];
      if (c) {
        cell.classList.add(c.kind);
        if (anim) cell.classList.add('drop');
        if (c.v.length === 2) cell.classList.add('two');
        if (c.v.length >= 3) cell.classList.add('three');
        var lb = document.createElement('span');
        lb.className = 'lb';
        lb.textContent = c.v;
        cell.appendChild(lb);
        var kx = document.createElement('span');
        kx.className = 'kx';
        kx.textContent = c.kind === 's' ? '声' : (c.kind === 'm' ? '介' : '韵');
        cell.appendChild(kx);
        if (sel.indexOf(i) >= 0) cell.classList.add('sel');
        (function (idx) {
          cell.addEventListener('click', function (e) {
            e.stopPropagation();
            onCellTap(idx);
          });
        })(i);
      } else {
        cell.classList.add('empty');
        cell.style.opacity = '0.35';
      }
      gridEl.appendChild(cell);
    }
  }

  function renderMyGrid(popChar) {
    Array.prototype.forEach.call(myGridEl.querySelectorAll('.fcell'), function (n) { n.remove(); });
    for (var i = 0; i < 4; i++) {
      var cell = document.createElement('div');
      cell.className = 'fcell';
      var c = myCells[i];
      if (c) {
        cell.classList.add('full');
        if (c === popChar) cell.classList.add('pop');
        var zh = document.createElement('span');
        zh.className = 'zh';
        zh.textContent = c.ch;
        cell.appendChild(zh);
        var py = document.createElement('span');
        py.className = 'py';
        py.textContent = c.p;
        cell.appendChild(py);
      }
      myGridEl.appendChild(cell);
    }
  }

  function renderFoeGrid(popChar) {
    Array.prototype.forEach.call(foeGridEl.querySelectorAll('.fcell'), function (n) { n.remove(); });
    var list = foe ? foe.grid : [];
    for (var i = 0; i < 4; i++) {
      var cell = document.createElement('div');
      cell.className = 'fcell';
      if (list[i]) {
        cell.classList.add('full');
        if (list[i] === popChar) cell.classList.add('pop');
        var zh = document.createElement('span');
        zh.className = 'zh';
        zh.textContent = list[i];
        cell.appendChild(zh);
      }
      foeGridEl.appendChild(cell);
    }
  }

  /* =====================================================================
     七、选卡与同音字阶梯
     ===================================================================== */
  var pvEl = document.getElementById('pvText');
  var tipEl = document.getElementById('tip');
  var ladderEl = document.getElementById('ladder');
  var lKeyEl = document.getElementById('lKey');
  var lSubEl = document.getElementById('lSub');
  var lOptsEl = document.getElementById('lOpts');
  var lTonesEl = document.getElementById('lTones');
  var lToneHint = document.getElementById('lToneHint');
  var ladderWord = null;
  var ladderCtx = null;

  function showPreview() {
    if (!sel.length) {
      pvEl.classList.remove('on');
      pvEl.innerHTML = '';
      return;
    }
    var vals = sel.map(function (i) { return cards[i].v; });
    pvEl.innerHTML = vals.join(' <b>+</b> ');
    pvEl.classList.add('on');
  }

  function onCellTap(i) {
    if (st.mode !== MODE.PLAY || st.lock || ladderWord) return;
    if (!cards[i]) return;
    var at = sel.indexOf(i);
    if (at >= 0) {
      sel.splice(at, 1);
      renderGrid(false);
      showPreview();
      SND.tap();
      return;
    }
    if (sel.length >= 3) sel = [];
    sel.push(i);
    SND.tap();
    renderGrid(false);
    showPreview();
    if (sel.length >= 2) trySolve();
  }

  /* 从选中的字母反推音节结构（声母+介母+韵母），
     用于主字库没收录、但拼音合法的音节（如 w+a、l+a） */
  function pseudoWord(vals) {
    var s = null, m = null, rest = [];
    vals.forEach(function (v) {
      if (!s && kindOf(v) === 's') { s = v; } else { rest.push(v); }
    });
    if (!s || !rest.length) return null;
    var y;
    if (vals.length === 3) {
      var mi = -1;
      for (var i = 0; i < rest.length; i++) { if (kindOf(rest[i]) === 'm') { mi = i; break; } }
      if (mi < 0) return null;
      m = rest[mi];
      rest.splice(mi, 1);
      y = rest[0];
    } else {
      y = rest[0];
    }
    var parts = [s];
    if (m) parts.push(m);
    parts.push(y);
    var key = parts.sort().join('|');
    if (!HOMO[key]) return null;
    var rep = HOMO[key][0];
    var w = { c: rep.c, p: rep.p, s: s, y: y };
    if (m) w.m = m;
    return w;
  }

  /* 场上（含敌将正在拼的）有没有木牌，正好等着「已选的两个字母 + 再来一个」的三拼 */
  function waiting3() {
    if (sel.length !== 2) return false;
    var list = [];
    plaques.forEach(function (q) { if (!q.dying) list.push(q.target); });
    if (foe && foe.state === 'spelling' && foe.target) list.push(foe.target);
    var a = cards[sel[0]] ? cards[sel[0]].v : null;
    var b = cards[sel[1]] ? cards[sel[1]].v : null;
    if (!a || !b) return false;
    return list.some(function (t) {
      var need = [t.s, t.m, t.y].filter(Boolean);
      if (need.length !== 3) return false;
      var ia = need.indexOf(a), ib = need.indexOf(b);
      if (ia < 0 || ib < 0) return false;
      return a !== b || ia !== ib;
    });
  }

  function trySolve() {
    var vals = sel.map(function (i) { return cards[i].v; }).slice().sort();
    var key = vals.join('|');
    var w = KEYMAP[key];

    if (w && vals.length === (w.m ? 3 : 2)) {
      /* 两张字母若只是顺路拼了个别的音，而木牌在等它们的三拼，先别弹面板 */
      if (vals.length === 2 && !plaqueFor(key) && waiting3()) {
        tipEl.textContent = '木牌要的是三拼音节 —— 再选一个字母';
        return;
      }
      openLadder(w);
      return;
    }
    /* 主字库没收录、但拼音合法的音节也能拼（任意能组成汉字的拼音） */
    if (!w && HOMO[key]) {
      var pw = pseudoWord(vals);
      if (pw) {
        if (vals.length === 2 && !plaqueFor(key) && waiting3()) {
          tipEl.textContent = '木牌要的是三拼音节 —— 再选一个字母';
          return;
        }
        openLadder(pw);
        return;
      }
    }
    /* 音节合法、但这个档位的字库还没有它的字（如第 1 阵拼 b+in） */
    if (HOMO_ALL[key] && !HOMO[key]) {
      /* 不依赖当前档字库，直接按字母类型拼出音节（b + in → bin） */
      var lsm = null, lmed = null, lfin = null;
      vals.forEach(function (v) {
        var kd = kindOf(v);
        if (!lsm && kd === 's') lsm = v;
        else if (!lmed && kd === 'm') lmed = v;
        else if (!lfin) lfin = v;
      });
      var syl = lsm ? (lsm + (lmed || '') + (lfin || '')) : '';
      var need = tierOf(st.level) === 1 ? '后面的关卡' : '第 11 关';
      tipEl.textContent = (syl ? syl + ' ' : '') + '这个音的字要到' + need + '才出现';
      SND.tap();
      /* 把选中的两张牌标一下，再自动松开，别让玩家以为卡住了 */
      var lockDoms = gridEl.children;
      sel.forEach(function (i) {
        if (lockDoms[i]) {
          lockDoms[i].classList.add('bad');
          setTimeout(function () { if (lockDoms[i]) lockDoms[i].classList.remove('bad'); }, 520);
        }
      });
      st.lock = true;
      setTimeout(function () {
        sel = [];
        st.lock = false;
        renderGrid(false);
        showPreview();
      }, 560);
      setTimeout(function () {
        if (st.mode === MODE.PLAY && !st.lock && !ladderWord) tipEl.textContent = '字母拼出音节 · 声调对上才是那个字';
      }, 2600);
      return;
    }
    if (sel.length === 3) {
      st.lock = true;
      missT = 0.4;
      SND.bad();
      var doms = gridEl.children;
      sel.forEach(function (i) {
        if (doms[i]) {
          doms[i].classList.add('bad');
          setTimeout(function () { if (doms[i]) doms[i].classList.remove('bad'); }, 360);
        }
      });
      setTimeout(function () {
        sel = [];
        st.lock = false;
        renderGrid(false);
        showPreview();
      }, 380);
    } else {
      tipEl.textContent = '再选一个字母试试（三拼）';
      setTimeout(function () {
        if (st.mode === MODE.PLAY && !st.lock && !ladderWord) tipEl.textContent = '字母拼出音节 · 声调对上才是那个字';
      }, 1200);
    }
  }

  /* ---------- 阶梯：先定声调，再出同调字 ---------- */
  var ladderTone = 1;
  var ladderPlaque = null;

  /* 场上有好几块木牌时，只要音节对得上就能打，不局限于最前面那块 */
  function plaqueFor(key) {
    for (var i = 0; i < plaques.length; i++) {
      if (!plaques[i].dying && keyOf(plaques[i].target) === key) return plaques[i];
    }
    return null;
  }

  function openLadder(w) {
    ladderWord = w;
    var key = keyOf(w);
    ladderPlaque = plaqueFor(key);
    ladderCtx = ladderPlaque ? 'plaque' : 'free';
    var target = ladderPlaque ? ladderPlaque.target : null;

    var parts = [w.s];
    if (w.m) parts.push(w.m);
    parts.push(w.y);
    /* 只显示字母本体，不先替玩家定调 */
    lKeyEl.innerHTML = parts.join(' + ') + ' → <b>' + bareOf(w.p) + '</b>';

    var groups = toneGroups(key);
    var toneList = [1, 2, 3, 4, 0].filter(function (t) { return groups[t].length; });
    var repTone = toneOf(w.p);
    ladderTone = toneList.indexOf(repTone) >= 0 ? repTone : toneList[0];

    lSubEl.textContent = target
      ? '木牌要「' + target.c + ' ' + target.p + '」· 调对了字才出来'
      : '拼出来了 · 先定声调，再挑字';
    lToneHint.textContent = '';

    lTonesEl.innerHTML = '';
    toneList.forEach(function (t) {
      var chip = document.createElement('div');
      chip.className = 'tChip' + (t === ladderTone ? ' on' : '');
      chip.setAttribute('data-tone', t);
      chip.innerHTML = '<span class="tpy">' + groups[t][0].p + '</span><span class="tno">' + TONE_NAME[t] + '</span>';
      chip.addEventListener('click', function (e) {
        e.stopPropagation();
        ladderTone = t;
        paintToneChips();
        renderLadderOpts();
        lToneHint.textContent = '';
        SND.tap();
      });
      lTonesEl.appendChild(chip);
    });

    renderLadderOpts();
    ladderEl.classList.add('on');
    SND.tap();
  }

  function paintToneChips() {
    Array.prototype.forEach.call(lTonesEl.children, function (c) {
      c.classList.toggle('on', Number(c.getAttribute('data-tone')) === ladderTone);
    });
  }

  function renderLadderOpts(markRight) {
    if (!ladderWord) return;
    var groups = toneGroups(keyOf(ladderWord));
    var opts = (groups[ladderTone] || []).slice();
    /* 常用字排前面：先简单的，再生僻的 */
    opts.sort(function (a, b) { return rankOf(a.c) - rankOf(b.c); });
    /* 低关卡少给几个选项（都从最简单的里面挑），关卡越高选项越多 */
    var maxN = st.level <= 5 ? 4 : (st.level <= 10 ? 5 : 6);
    if (opts.length > maxN) {
      var tgt0 = (ladderCtx === 'plaque' && ladderPlaque) ? ladderPlaque.target : null;
      opts = opts.slice(0, maxN);
      if (tgt0) {
        var hasT = false;
        for (var oi = 0; oi < opts.length; oi++) if (opts[oi].c === tgt0.c) { hasT = true; break; }
        if (!hasT) opts[maxN - 1] = tgt0;
      }
    }
    shuffle(opts);
    var target = (ladderCtx === 'plaque' && ladderPlaque) ? ladderPlaque.target : null;
    lOptsEl.innerHTML = '';
    opts.forEach(function (o) {
      var b = document.createElement('div');
      b.className = 'lOpt' + (markRight && target && o.c === target.c ? ' good' : '');
      b.innerHTML = '<div class="zh">' + o.c + '</div><div class="py">' + o.p + '</div>';
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        onLadderPick(o, b);
      });
      lOptsEl.appendChild(b);
    });
  }

  function closeLadder() {
    ladderEl.classList.remove('on');
    ladderWord = null;
    ladderCtx = null;
    ladderPlaque = null;
    lToneHint.textContent = '';
  }

  document.getElementById('lCancel').addEventListener('click', function (e) {
    e.stopPropagation();
    closeLadder();
    SND.tap();
  });
  ladderEl.addEventListener('click', function (e) {
    if (e.target === ladderEl) { closeLadder(); }
  });

  function onLadderPick(o, btn) {
    if (!ladderWord) return;
    var pl = ladderPlaque;
    var target = (ladderCtx === 'plaque' && pl) ? pl.target : null;

    /* 只有打木牌时才指定字：字和调都要对得上 */
    if (target && o.c !== target.c) {
      SND.bad();
      breakCombo();
      btn.classList.add('bad');
      st.lock = true;
      missT = 0.5;
      pl.spMul = Math.min((pl.spMul || 1) * 1.25, 1.8);

      var wrongTone = toneOf(o.p) !== toneOf(target.p);
      if (wrongTone) {
        lToneHint.textContent = o.p + ' 是' + TONE_NAME[toneOf(o.p)] + '，木牌要 ' + target.p + '（' + TONE_NAME[toneOf(target.p)] + '）';
        tipEl.textContent = '声调不对：' + o.p + ' ≠ ' + target.p;
      } else {
        lToneHint.textContent = '调对了，但字不对 —— 木牌上写的是「' + target.c + '」';
        tipEl.textContent = '声调对了，字选错了';
      }
      /* 把玩家引到正确的那一格：切到目标调，标出正确的字 */
      ladderTone = toneOf(target.p);
      paintToneChips();
      renderLadderOpts(true);

      sel = [];
      renderGrid(false);
      showPreview();
      setTimeout(function () {
        closeLadder();
        st.lock = false;
        if (st.mode === MODE.PLAY) tipEl.textContent = '字母拼出音节 · 声调对上才是那个字';
      }, 1100);
      return;
    }

    /* 选对（自由拼字以玩家选的字为准） */
    var w = ladderWord;
    var ch = o.c, py = o.p;
    var isPlaqueHit = !!target;
    var hitPlaque = isPlaqueHit ? pl : null;
    closeLadder();
    SND.ok(!!w.m);

    var used = sel.slice();
    sel = [];
    var doms = gridEl.children;
    used.forEach(function (i) { if (doms[i]) doms[i].classList.add('pop'); });

    /* 学习档案 */
    var lvBefore = profLevel();
    var rec = prof.chars[ch];
    if (!rec || !rec.n) {
      prof.chars[ch] = { n: 1, t: Date.now() };
      newLearned.push(ch);
    } else {
      rec.n++;
      rec.t = Date.now();
    }
    prof.total++;
    saveProfile();
    var lvAfter = profLevel();

    /* 手速采样：从上一次拼出字到现在隔了多久 */
    if (st.lastChar >= 0) skillNote(st.playT - st.lastChar);
    st.lastChar = st.playT;

    st.score++;
    if (runChars.length < 40) runChars.push(ch);
    hitCombo();
    popScore();

    setTimeout(function () {
      used.forEach(function (i) { cards[i] = null; });
      renderGrid(false);
      showPreview();

      /* 字落进我方字格 */
      addMyChar({ c: ch, p: py });
      renderChars(ch);

      /* 攻击：一脚把字当火苗踢出去。
         敌将正在拼字时，字直接飞到画面中间跟他的字对撞；否则去烧木牌/敌将 */
      var mid = !hitPlaque && foe && foe.state === 'spelling' && foe.target;
      var dmg = 1;
      st.kickT = 0.36;
      var sh = {
        x: zyX + 18, y: fieldY - 28, t: 0, dur: 0.46,
        ch: ch, dmg: dmg, plaque: hitPlaque,
        tx: mid ? W / 2 : foeX, ty: mid ? fieldY - 74 : fieldY - 64,
        foeWord: mid ? foe.target.c : null,
        done: false, seed: Math.random() * 10
      };
      sh.dmg = 1;
      shots.push(sh);
      burnBurst(zyX + 24, fieldY - 28);
      SND.hit();

      updateHud();
      setTimeout(function () {
        st.lock = false;
        if (lvAfter > lvBefore) {
          st.gold = 0.5;
          tipEl.textContent = '已学 ' + learnedCount() + ' 字 · 难度加深！';
          setTimeout(function () {
            if (st.mode === MODE.PLAY) tipEl.textContent = '字母拼出音节 · 声调对上才是那个字';
          }, 2000);
        } else {
          tipEl.textContent = '字母拼出音节 · 声调对上才是那个字';
        }
        refill();
      }, 300);
    }, 250);
  }

  /* =====================================================================
     八、我方字格与字将
     ===================================================================== */
  function addMyChar(w) {
    var idx = -1;
    for (var i = 0; i < 4; i++) { if (!myCells[i]) { idx = i; break; } }
    if (idx < 0) {
      /* 满了挤掉最旧的 */
      myCells.shift();
      myCells.push({ ch: w.c, p: w.p });
    } else {
      myCells[idx] = { ch: w.c, p: w.p };
    }
    renderMyGrid(w.c);

    /* 军阶判定：四字成语 = 大将军；两字词语 = 营长；单字 = 小兵 */
    var present = myCells.filter(Boolean);
    var idiom = findIdiom(present);
    if (idiom) {
      fireGeneral(idiom, present.slice(0, 4).map(function (c) { return c.ch; }));
      return;
    }
    for (var a = 0; a < present.length; a++) {
      for (var b = a + 1; b < present.length; b++) {
        var w1 = present[a].ch, w2 = present[b].ch;
        var word = WORD_SET[w1 + w2] ? (w1 + w2) : (WORD_SET[w2 + w1] ? (w2 + w1) : null);
        if (word) { fireGeneral(word, [w1, w2]); return; }
      }
    }
  }

  /* 四个字任意排列能凑成成语就算（孩子不会按顺序拼） */
  function findIdiom(cells) {
    if (cells.length < 4) return null;
    var cs = cells.slice(0, 4).map(function (c) { return c.ch; });
    var hit = null;
    (function perm(arr, cur) {
      if (hit) return;
      if (!arr.length) { if (IDIOM_SET[cur]) hit = cur; return; }
      for (var i = 0; i < arr.length && !hit; i++) {
        perm(arr.slice(0, i).concat(arr.slice(i + 1)), cur + arr[i]);
      }
    })(cs, '');
    return hit;
  }

  /* 字将出战：词语=营长（2 伤）、成语=大将军（3 伤，一击定胜负） */
  function fireGeneral(word, used) {
    var isIdiom = word.length >= 4;
    var rank = isIdiom ? '大将军' : '营长';
    var dmg = isIdiom ? 3 : 2;

    SND.general();
    st.gold = 0.75;
    st.shake = Math.max(st.shake, isIdiom ? 0.6 : 0.35);

    var gEl = document.getElementById('general');
    gEl.querySelector('.gname').textContent = rank;
    gEl.querySelector('.gword').textContent = word.split('').join(' ');
    gEl.classList.add('on');
    setTimeout(function () { gEl.classList.remove('on'); }, 1200);

    /* 烧掉参战的字格 */
    Array.prototype.forEach.call(myGridEl.querySelectorAll('.fcell'), function (cell) {
      var zh = cell.querySelector('.zh');
      if (zh && used.indexOf(zh.textContent) >= 0) cell.classList.add('boom');
    });
    setTimeout(function () {
      myCells = myCells.map(function (c) {
        return (c && used.indexOf(c.ch) >= 0) ? null : c;
      });
      renderMyGrid(null);
    }, 500);

    /* 清掉所有木牌 */
    plaques.forEach(function (pl) { burnBurst(pl.x, pl.y + 12); });
    plaques.length = 0;

    setTimeout(function () {
      var foeWord = (foe && foe.state === 'spelling' && foe.target) ? foe.target.c : null;
      generalStrike();
      /* 中间对撞：敌将当场挨这一下 */
      clashAt(rank, word, dmg, foeWord);
      damageFoe(dmg, foeX, fieldY - 60, true);
      tipEl.textContent = rank + '出阵：' + word + ' · ' + dmg + ' 点伤害';
    }, 260);
  }

  /* 中间对撞：我方字从左边撞上去，敌将的字在中间碎掉 */
  function clashAt(rank, word, dmg, foeWord) {
    clashes.push({
      x: W / 2, y: fieldY - 74, word: word, rank: rank, dmg: dmg, foeWord: foeWord || null,
      t: 0, dur: 0.85, seed: Math.random() * 10
    });
    burst(W / 2, fieldY - 74, 26, 'rgba(198,164,104,0.85)');
    burst(W / 2, fieldY - 74, 14, 'rgba(184,69,58,0.75)');
  }

  /* 字将出手：烧光木牌、打断敌将拼字、把他往后逼。
     注意：不给额外伤害 —— 一轮必须老老实实打够 hitsNeeded() 次。 */
  function generalStrike() {
    if (!foe || st.mode !== MODE.PLAY) return;
    foe.hitT = 0.4;
    st.shake = Math.max(st.shake, 0.5);
    burnBurst(foeX - 14, fieldY - 58);
    if (foe.state === 'spelling') {
      foe.state = 'idle';
      foe.target = null;
      foe.idleT = 2.4;
      tipEl.textContent = '字将出手：打断敌将，木牌全烧了';
    } else {
      foe.idleT = Math.max(foe.idleT, 2.4);
      tipEl.textContent = '字将出手：木牌全烧了';
    }
  }

  /* =====================================================================
     九、敌将与木牌
     ===================================================================== */
  /* 双方都是 3 点血：谁先被打满 3 点伤害，谁就倒下。
     单字（小兵）1 伤 · 词语（营长）2 伤 · 成语（大将军）3 伤 */
  var HP_MAX = 3;
  function hitsNeeded() {
    return HP_MAX;
  }

  /* =====================================================
     波次渐进（参照《汉字攻防战》的对战节奏）：
     每阵分 3 波——开局第 1 波最松，打得越接近胜利越快，
     但每一波之间都有喘息阀兜底，慢节奏玩家永远追得上。
     ===================================================== */
  function foeProgress() {
    if (!foe || !foe.maxHp) return 0;
    return Math.min(Math.max((foe.maxHp - foe.hp) / foe.maxHp, 0), 1);
  }
  function waveOf() {
    var p = foeProgress();
    return p >= 0.72 ? 3 : (p >= 0.36 ? 2 : 1);
  }
  /* 出牌间隔系数：第 1 波 ×1.7 → 第 3 波 ×0.85（慢速档） */
  function spawnRamp(p) {
    if (slowPace) return 1.7 - 0.85 * p;
    return 1.35 - 0.45 * p;
  }
  /* 木牌速度系数：第 1 波 ×0.8 → 第 3 波 ×1.25 */
  function speedRamp(p) {
    return 0.8 + 0.45 * p;
  }

  /* 喘息阀：场上压着的木牌越多，敌将出手前等得越久 */
  function alivePlaques() {
    var n = 0;
    for (var i = 0; i < plaques.length; i++) if (!plaques[i].dying) n++;
    return n;
  }

  function spawnFoe() {
    var hpBase = hitsNeeded();   /* 单位是「次」，不是点数 */
    foe = {
      hp: hpBase, maxHp: hpBase, waveShown: 1,
      state: 'idle', idleT: 2.2 * paceT(2.4) / levelSpeedMul(), spellT: 0, spellDur: 3.6,
      target: null, grid: [], surge: 0, hitT: 0, kickT: 0
    };
    renderFoeGrid(null);
  }

  function foeUpdate(dt) {
    if (!foe) return;
    if (foe.hitT > 0) foe.hitT -= dt;
    if (foe.kickT > 0) foe.kickT -= dt;
    if (foe.deadT > 0) foe.deadT = Math.max(0, foe.deadT - dt);
    if (foe.fadeT > 0) foe.fadeT = Math.max(0, foe.fadeT - dt);
    if (foe.state === 'clear') return;   /* 破关演出期间不出牌 */
    if (foe.state === 'idle') {
      foe.idleT -= dt;
      if (foe.idleT <= 0) {
        foe.target = pickTarget();
        ensureLetters(foe.target);
        foe.state = 'spelling';
        foe.spellT = 0;
        foe.spellDur = Math.max(2.0, 3.8 - Math.min(st.level, 8) * 0.16) * paceT(1.8) / levelSpeedMul();
      }
    } else {
      foe.spellT += dt * accelF();
      if (foe.spellT >= foe.spellDur) {
        spawnPlaque(foe.target);
        foe.kickT = 0.36;
        foe.state = 'idle';
        var mercy = alivePlaques() >= 2 ? 1.9 : 1;
        foe.idleT = rand(1.6, 2.6) / accelF() * paceT(2.6) * spawnRamp(foeProgress()) * mercy * levelSpawnMul();
      }
    }
  }

  var spawnTotal = 0;   /* 本局累计出牌数（自检用） */

  function spawnPlaque(w) {
    spawnTotal++;
    var boss = (st.level % 5 === 0) || foe.surge > 0;
    if (foe.surge > 0) foe.surge--;
    var sp = (19 + Math.min(st.level, 10) * 1.5) * (boss ? 0.85 : 1) * paceT(1) * (slowPace ? 0.62 : 1) * speedRamp(foeProgress()) * levelSpeedMul();
    plaques.push({
      x: W + 46, y: fieldY - 42, target: w,
      hp: boss ? 2 : 1, maxHp: boss ? 2 : 1,
      sp: sp, spMul: 1, seed: Math.random() * 10, boss: boss, hitT: 0, burnT: 0, scorch: 0
    });
    foe.grid.push(w.c);
    renderFoeGrid(w.c);
    if (foe.grid.length >= 4) {
      foe.surge = 2;
      setTimeout(function () {
        foe.grid = [];
        renderFoeGrid(null);
        tipEl.textContent = '敌将凑成了词，下一块是令牌！';
      }, 700);
    }
  }

  function plaquesUpdate(dt) {
    for (var i = plaques.length - 1; i >= 0; i--) {
      var pl = plaques[i];
      if (pl.hitT > 0) pl.hitT -= dt;
      if (pl.burnT > 0) pl.burnT -= dt;

      /* 被烧毁的木牌：原地烧完再散架 */
      if (pl.dying) {
        pl.dieT -= dt;
        if (Math.random() < dt * 22) burnBurst(pl.x + rand(-14, 14), pl.y + rand(0, 16));
        if (pl.dieT <= 0) plaques.splice(i, 1);
        continue;
      }

      pl.x -= pl.sp * (pl.spMul || 1) * accelF() * dt;
      if (pl.x <= guardX + 16) {
        plaques.splice(i, 1);
        loseHeart(pl.boss ? 2 : 1);   /* 令牌撞城，一次掉 2 点血 */
        if (st.mode !== MODE.PLAY) return;
      }
    }
  }

  function damageFoe(dmg, x, y, isWord) {
    if (!foe || st.mode !== MODE.PLAY || st.clearing) return;
    foe.hp -= dmg;
    /* 换波：敌将提速前先顿一拍，给孩子一个可感知的节奏点 */
    var wv = waveOf();
    if (wv > foe.waveShown) {
      foe.waveShown = wv;
      foe.idleT = Math.max(foe.idleT, 2.5);
      tipEl.textContent = '第 ' + wv + ' 波！敌将变快了，稳住';
      updateHud();
    }
    foe.hitT = 0.28;
    st.shake = Math.max(st.shake, isWord ? 0.5 : 0.18);
    burnBurst(x, y);
    if (isWord) {
      /* 将领效果：打断敌将拼字，逼他重新起手 */
      if (foe.state === 'spelling') {
        foe.state = 'idle';
        foe.target = null;
        foe.idleT = 2.0;
      } else {
        foe.idleT = Math.max(foe.idleT, 1.6);
      }
    }
    if (foe.hp <= 0) { clearLevel(); return; }
    /* 伤害落地的瞬间就刷新 HUD 血量：孩子要亲眼看着 3/3 → 2/3 → 1/3 */
    updateHud();
    if (foe.hp === 1 && !st.clearing) {
      banner('敌 将 只 剩 一 点 血', '再拼对一个字就赢', 'win');
      SND.combo(10);
    } else if (!isWord) {
      tipEl.textContent = '打中！敌方还剩 ' + foe.hp + ' 点血';
    }
  }

  /* 破一关：先把"赢了"演出来，再开下一阵。
     演出期间 foe.state='clear'，不出牌、木牌全烧掉，给玩家 1 秒成就感。 */
  var PRAISE = ['漂亮！', '这关稳了', '守得干净', '打得痛快', '一鼓作气', '阵脚没乱'];
  function clearLevel() {
    if (st.clearing || st.mode !== MODE.PLAY) return;
    st.clearing = true;
    var lvCleared = st.level;
    var prevTier = tierOf(lvCleared);

    /* 场上木牌一起烧掉：破关瞬间先清场，别让残牌偷命 */
    for (var i = 0; i < plaques.length; i++) {
      var pl = plaques[i];
      if (!pl.dying) { pl.dying = true; pl.dieT = 0.5; burnBurst(pl.x, pl.y + 10); }
    }

    foe.hp = 0;
    foe.state = 'clear';
    foe.target = null;
    foe.grid = [];
    foe.deadT = 0.95;
    foe.hitT = 0;
    renderFoeGrid(null);

    st.gold = 1;
    st.shake = Math.max(st.shake, 0.55);
    burst(foeX, fieldY - 58, 34, 'rgba(198,164,104,0.8)');
    burst(foeX, fieldY - 44, 18, 'rgba(184,69,58,0.55)');

    /* 一场胜利 = 一个连胜，满 5 场封"常胜将军" */
    var streak = lvCleared;
    st.streak = streak;
    if (streak > st.bestStreak) {
      st.bestStreak = streak;
      try { localStorage.setItem('pzqb_beststreak', String(streak)); } catch (e) {}
    }
    var gotTitle = false;
    if (streak >= 5 && !st.title) {
      st.title = '常胜将军';
      gotTitle = true;
      st.gold = 1;
      try { localStorage.setItem('pzqb_title', st.title); } catch (e) {}
    }

    st.level = lvCleared + 1;
    rebuildTier(st.level);

    var word = PRAISE[(Math.random() * PRAISE.length) | 0];
    var sub = '连胜 ' + streak + ' 场 · ' + (st.hearts >= 3 ? '无伤' : '还剩 ' + st.hearts + ' 血');
    banner(gotTitle ? '常 胜 将 军' : '第 ' + streak + ' 关 · 胜',
      gotTitle ? ('连 胜 五 场 · ' + word) : sub, 'win');
    SND.clear();
    if (gotTitle) setTimeout(function () { SND.general(); }, 320);
    popScore();
    updateHud();

    setTimeout(function () {
      st.clearing = false;
      showClearScreen(lvCleared, gotTitle, prevTier);
    }, gotTitle ? 1700 : 1150);
  }

  function nextLevel(prevTier) {
    if (!foe || st.mode !== MODE.PLAY) return;
    st.levelStart = runChars.length;
    foe.hp = hitsNeeded();
    foe.maxHp = foe.hp;
    foe.grid = [];
    foe.surge = 0;
    foe.state = 'idle';
    foe.idleT = 2.2 * paceT(1.4);
    foe.waveShown = 1;
    foe.deadT = 0;
    foe.fadeT = 0.5;
    renderFoeGrid(null);
    var newTier = tierOf(st.level);
    if (st.level === 6) {
      tipEl.textContent = '第 6 关！之后对手照你的手速配：' + matchLabel().replace('对手·', '');
    } else if (newTier !== prevTier) {
      tipEl.textContent = newTier === 2
        ? '第 ' + st.level + ' 关！字开始变难了'
        : '第 ' + st.level + ' 关！生僻字登场了';
    } else {
      tipEl.textContent = '第 ' + st.level + ' 关！敌将重整旗鼓';
    }
    updateHud();
  }

  /* 掉血：疼一下，说清楚还剩几点。最后一点血有专门的提醒。 */
  function loseHeart(dmg) {
    if (!dmg) dmg = 1;
    st.hearts -= dmg;
    if (st.hearts < 0) st.hearts = 0;
    st.shake = 0.62;
    st.flash = 0.5;
    breakCombo();
    /* 掉血说明真的跟不上：对手松一档，并从这一刻重新计手速 */
    skillDrop(dmg > 1 ? 0.14 : 0.08);
    st.lastChar = -1;
    burst(guardX, fieldY - 34, 22, 'rgba(184,69,58,0.62)');
    updateHud();

    if (st.hearts <= 0) {
      st.lock = true;
      st.failT = 1.05;
      closeLadder();
      banner('守 城 失 守', '小将倒下了 · 这一局结束', 'bad');
      SND.hurt();
      return;
    }

    SND.hurt();
    if (st.hearts === 1) {
      setTimeout(function () { if (st.mode === MODE.PLAY) SND.lastLife(); }, 180);
      banner('最 后 一 点 血', '木牌上写什么，看清再拼', 'bad');
    } else {
      banner(dmg > 1 ? '令 牌 撞 城' : '木 牌 进 城', '还剩 ' + st.hearts + ' 点血', 'bad');
    }
    if (foe) foe.idleT = Math.max(foe.idleT, 3.5 * paceT(2));
    tipEl.textContent = '木牌进城了！守住下一块';
  }

  function burst(x, y, n, color) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU, sp = rand(40, 200);
      bits.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50,
        r: rand(1.2, 3.2), life: rand(0.3, 0.65), max: 0.65, c: color
      });
    }
  }

  /* =====================================================================
     十、HUD
     ===================================================================== */
  var heartsEl = document.getElementById('hearts');
  var scoreEl = document.getElementById('score');
  var metaEl = document.getElementById('meta');
  var titleEl = document.getElementById('titleTag');
  var matchTagEl = document.getElementById('matchTag');
  var charlistEl = document.getElementById('charlist');
  var HEART_SVG = '<svg class="heart" viewBox="0 0 24 22"><path d="M12 21s-9-5.7-9-12A5 5 0 0 1 12 6a5 5 0 0 1 9 3c0 6.3-9 12-9 12z" fill="#b8453a"/></svg>';

  function updateHud() {
    var h = '';
    for (var i = 0; i < 3; i++) {
      h += HEART_SVG.replace('class="heart"', 'class="heart' + (i < st.hearts ? '' : ' gone') + '"');
    }
    heartsEl.innerHTML = h;
    scoreEl.textContent = st.score;
    if (st.clearing) {
      metaEl.textContent = '破 关 · 下一阵';
    } else if (st.mode === MODE.INTER) {
      metaEl.textContent = '第 ' + st.level + ' 关 · 等 候 出 战';
    } else if (foe) {
      metaEl.textContent = '第 ' + st.level + ' 关 · 敌将 ' + Math.max(0, foe.hp) + '/' + foe.maxHp +
        ' · 第' + waveOf() + '波';
    } else {
      metaEl.textContent = '第 ' + st.level + ' 关';
    }
    /* 第 5 关以后，左下角告诉玩家：对手是照你的手速配的 */
    var showMatch = st.level > 5 && st.mode === MODE.PLAY && !st.clearing && speedLog.length >= 2;
    if (showMatch) {
      matchTagEl.textContent = matchLabel();
      matchTagEl.classList.add('on');
      matchTagEl.classList.toggle('hot', skillNow() >= 0.62);
    } else {
      matchTagEl.classList.remove('on');
      matchTagEl.classList.remove('hot');
    }
    wrap.classList.toggle('lowlife', st.hearts === 1 && st.mode === MODE.PLAY);
    if (st.title) {
      titleEl.textContent = st.title;
      titleEl.classList.add('on');
    } else if (st.streak >= 2) {
      titleEl.textContent = '连 胜 ' + st.streak + ' 场';
      titleEl.classList.add('on');
    } else {
      titleEl.classList.remove('on');
    }
  }

  /* =====================================================================
     十·五、情绪层：横幅、连击、得分跳动
     孩子看得懂输赢，全靠这层：破关要有锣、掉命要有疼、连中要有夸奖。
     ===================================================================== */
  var bannerEl = document.getElementById('banner');
  var bannerMain = bannerEl.querySelector('.bMain');
  var bannerSub = bannerEl.querySelector('.bSub');
  var bannerT = null;
  function banner(main, sub, kind) {
    bannerEl.className = kind || '';
    bannerMain.textContent = main;
    bannerSub.textContent = sub || '';
    bannerSub.style.display = sub ? 'block' : 'none';
    /* 重启动画：同一句连喊两次也能再弹一下 */
    bannerMain.style.animation = 'none';
    void bannerMain.offsetWidth;
    bannerMain.style.animation = '';
    bannerEl.classList.add('on');
    clearTimeout(bannerT);
    bannerT = setTimeout(function () { bannerEl.classList.remove('on'); }, kind === 'win' ? 1080 : 920);
  }

  var comboEl = document.getElementById('comboTag');
  function paintCombo() {
    if (st.combo >= 2) {
      comboEl.innerHTML = '连 中 ×<b>' + st.combo + '</b>';
      comboEl.classList.add('on');
      comboEl.classList.remove('pop');
      void comboEl.offsetWidth;
      comboEl.classList.add('pop');
    } else {
      comboEl.classList.remove('on');
    }
  }
  var COMBO_WORDS = {
    3: '手感来了', 5: '连中五个，稳住', 8: '八连！敌将慌了',
    12: '十二连，这谁拦得住', 16: '老将附体', 20: '二十连！木牌不够烧'
  };
  function hitCombo() {
    st.combo++;
    if (st.combo > st.maxCombo) st.maxCombo = st.combo;
    paintCombo();
    if (st.combo >= 2) SND.combo(st.combo);
    if (COMBO_WORDS[st.combo] && !st.clearing && st.failT <= 0) {
      banner(COMBO_WORDS[st.combo], '连 中 ×' + st.combo, 'win');
    }
  }
  function breakCombo() {
    st.combo = 0;
    paintCombo();
  }

  function popScore() {
    scoreEl.classList.remove('pop');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop');
  }

  function renderChars(newChar) {
    chars.push(newChar);
    if (chars.length > 6) chars.shift();
    charlistEl.innerHTML = '';
    chars.forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'chip' + (c === newChar ? ' new' : '');
      d.textContent = c;
      charlistEl.appendChild(d);
    });
  }

  /* =====================================================================
     十一、主循环
     ===================================================================== */
  function update(dt) {
    st.t += dt;
    if (st.shake > 0) st.shake = Math.max(0, st.shake - dt * 1.8);
    if (st.flash > 0) st.flash = Math.max(0, st.flash - dt * 2.2);
    if (st.gold > 0) st.gold = Math.max(0, st.gold - dt * 1.6);
    if (missT > 0) missT -= dt;
    if (st.kickT > 0) st.kickT -= dt;

    for (var i = bits.length - 1; i >= 0; i--) {
      var b = bits[i];
      b.life -= dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 520 * dt;
    }

    for (var ci = clashes.length - 1; ci >= 0; ci--) {
      clashes[ci].t += dt;
      if (clashes[ci].t >= clashes[ci].dur) clashes.splice(ci, 1);
    }

    for (var s = shots.length - 1; s >= 0; s--) {
      var sh = shots[s];
      sh.t += dt;
      if (sh.plaque && plaques.indexOf(sh.plaque) >= 0) {
        sh.tx = sh.plaque.x;
        sh.ty = sh.plaque.y - 26;
      }
      if (sh.t >= sh.dur && !sh.done) {
        sh.done = true;
        if (sh.plaque && plaques.indexOf(sh.plaque) >= 0) {
          var pl = sh.plaque;
          pl.hp--;
          pl.hitT = 0.3;
          pl.burnT = 0.9;
          pl.scorch = (pl.scorch || 0) + 1;
          burnBurst(pl.x, pl.y + 16);
          if (pl.hp <= 0) {
            /* 烧毁：原地烧 0.75 秒再散架 */
            pl.dying = true;
            pl.dieT = 0.75;
            burnBurst(pl.x, pl.y + 10);
            damageFoe(1, pl.x, pl.y - 26, false);
          } else {
            damageFoe(1, pl.x, pl.y - 26, false);
            tipEl.textContent = '令牌烧裂了，再烧一次！';
          }
        } else {
          burnBurst(sh.tx, sh.ty);
          if (sh.foeWord) clashAt('小兵', sh.ch, 1, sh.foeWord);
          damageFoe(1, sh.tx, sh.ty, false);
        }
        shots.splice(s, 1);
      }
    }

    /* 失守定格：让玩家看清最后一块木牌怎么破的，再进结算 */
    if (st.failT > 0) {
      st.failT -= dt;
      if (st.failT <= 0) { st.failT = 0; gameOver(); }
      return;
    }

    if (st.mode !== MODE.PLAY) return;

    st.elapsed += dt;
    if (!st.clearing) st.playT += dt;   /* 手速时钟：破关演出、战报屏都不走 */

    /* 字母栏：有空格就立刻补满。
       玩家正在选字母（sel 非空）或开着选字面板时，格子一律不动。 */
    if (!st.lock && !ladderWord && !sel.length) {
      var grew;
      if (pending.length) {
        grew = flushPending();
      } else {
        grew = topUp();
      }
      if (grew.length) {
        renderGrid(false);
        markDrop(grew);
        SND.drop();
      }
      /* 选字母期间压下来的目标字母，现在补 */
      if (pendingEnsure) {
        var pw = pendingEnsure;
        pendingEnsure = null;
        if (ensureLetters(pw)) renderGrid(false);
      }
      if (grew.length && !hasSolution()) refill();
    }

    foeUpdate(dt);
    plaquesUpdate(dt);
  }

  /* =====================================================================
     十二、绘制
     ===================================================================== */
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (paperCanvas) ctx.drawImage(paperCanvas, 0, 0, W, H);
    else { ctx.fillStyle = '#f8f5ec'; ctx.fillRect(0, 0, W, H); }

    var sx = 0, sy = 0;
    if (st.shake > 0) {
      var m = st.shake * 11;
      sx = rand(-m, m); sy = rand(-m, m);
    }
    ctx.save();
    ctx.translate(sx, sy);

    drawSky();
    drawMountains();
    drawGround();
    drawGate();
    drawZhaoyun();
    drawFoeGeneral();
    drawPlaques();
    drawShots();
    drawClashes();
    drawBits();

    ctx.restore();

    if (st.gold > 0) {
      ctx.fillStyle = 'rgba(198,164,104,' + (st.gold * 0.20).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (st.flash > 0) {
      ctx.fillStyle = 'rgba(184,69,58,' + (st.flash * 0.20).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawSky() {
    var mx = W * 0.79, my = fieldY * 0.30, mr = Math.min(20, W * 0.048);
    var halo = ctx.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 4.2);
    halo.addColorStop(0, 'rgba(198,118,92,0.18)');
    halo.addColorStop(0.5, 'rgba(198,118,92,0.06)');
    halo.addColorStop(1, 'rgba(198,118,92,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 4.2, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(196,110,86,0.26)';
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();

    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(120,130,132,0.15)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(W * 0.13, fieldY * 0.27);
    ctx.quadraticCurveTo(W * 0.22, fieldY * 0.21, W * 0.32, fieldY * 0.26);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(120,130,132,0.10)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(W * 0.40, fieldY * 0.40);
    ctx.quadraticCurveTo(W * 0.47, fieldY * 0.35, W * 0.57, fieldY * 0.39);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function drawMountains() {
    ctx.fillStyle = 'rgba(96,112,118,0.11)';
    ctx.beginPath();
    ctx.moveTo(0, fieldY);
    ctx.bezierCurveTo(W * 0.10, fieldY * 0.66, W * 0.20, fieldY * 0.40, W * 0.33, fieldY * 0.43);
    ctx.bezierCurveTo(W * 0.45, fieldY * 0.46, W * 0.50, fieldY * 0.72, W * 0.63, fieldY * 0.74);
    ctx.bezierCurveTo(W * 0.75, fieldY * 0.76, W * 0.81, fieldY * 0.50, W * 0.93, fieldY * 0.53);
    ctx.lineTo(W, fieldY * 0.56);
    ctx.lineTo(W, fieldY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(78,94,102,0.14)';
    ctx.beginPath();
    ctx.moveTo(0, fieldY);
    ctx.bezierCurveTo(W * 0.07, fieldY * 0.82, W * 0.15, fieldY * 0.67, W * 0.25, fieldY * 0.69);
    ctx.bezierCurveTo(W * 0.37, fieldY * 0.71, W * 0.43, fieldY * 0.92, W * 0.55, fieldY * 0.93);
    ctx.bezierCurveTo(W * 0.67, fieldY * 0.94, W * 0.76, fieldY * 0.76, W * 0.88, fieldY * 0.78);
    ctx.lineTo(W, fieldY * 0.82);
    ctx.lineTo(W, fieldY);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(78,88,94,0.22)';
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(W * 0.12, fieldY * 0.78);
    ctx.quadraticCurveTo(W * 0.24, fieldY * 0.50, W * 0.38, fieldY * 0.60);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function drawGround() {
    var g = ctx.createLinearGradient(0, fieldY, 0, H * 0.47);
    g.addColorStop(0, 'rgba(120,132,128,0.15)');
    g.addColorStop(0.5, 'rgba(120,132,128,0.05)');
    g.addColorStop(1, 'rgba(120,132,128,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, fieldY, W, H * 0.47 - fieldY);

    ctx.strokeStyle = 'rgba(74,84,88,0.38)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, fieldY);
    ctx.lineTo(W, fieldY);
    ctx.stroke();
  }

  function drawGate() {
    var ink = 'rgba(60,68,72,0.55)';
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(guardX - 18, fieldY);
    ctx.lineTo(guardX - 18, fieldY - 76);
    ctx.moveTo(guardX + 8, fieldY);
    ctx.lineTo(guardX + 8, fieldY - 76);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(guardX - 26, fieldY - 76);
    ctx.lineTo(guardX + 16, fieldY - 76);
    ctx.stroke();

    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(guardX - 30, fieldY - 82);
    ctx.lineTo(guardX - 18, fieldY - 76);
    ctx.moveTo(guardX + 20, fieldY - 82);
    ctx.lineTo(guardX + 8, fieldY - 76);
    ctx.stroke();
    ctx.lineCap = 'butt';

    ctx.fillStyle = 'rgba(184,69,58,0.6)';
    ctx.beginPath(); ctx.arc(guardX - 5, fieldY - 62, 4.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(60,68,72,0.3)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(guardX - 5, fieldY - 76);
    ctx.lineTo(guardX - 5, fieldY - 66);
    ctx.stroke();

    var pulse = 0.09 + 0.06 * Math.abs(Math.sin(st.t * 2.2));
    var lg = ctx.createLinearGradient(guardX - 10, 0, guardX + 22, 0);
    lg.addColorStop(0, 'rgba(90,120,130,0)');
    lg.addColorStop(0.5, 'rgba(90,120,130,' + pulse.toFixed(2) + ')');
    lg.addColorStop(1, 'rgba(90,120,130,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(guardX - 10, fieldY - 82, 34, 82);
  }

  /* 火柴人：一根墨线勾身子，四点画完四肢。
     pal.ink 主墨色，pal.accent 朱砂点缀（红缨 / 腰带）
     kick 0~1：踢出火苗时抬腿的幅度 */
  function drawWarrior(pal, kick) {
    var ink = pal.ink;
    var acc = pal.accent;
    var k = clamp(kick || 0, 0, 1);
    var sway = Math.sin(st.t * 2.1) * 1.1;

    /* 脚下淡影 */
    ctx.fillStyle = 'rgba(96,106,108,0.10)';
    ctx.beginPath(); ctx.ellipse(0, 1, 16, 3.4, 0, 0, TAU); ctx.fill();

    ctx.save();
    ctx.rotate(-0.10 * k);           /* 抬腿时身子后仰 */

    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var hipY = -31;
    var neckY = -51 + sway * 0.3;
    var headY = -60 + sway * 0.5;

    /* 躯干一根线 */
    ctx.beginPath();
    ctx.moveTo(0, hipY);
    ctx.lineTo(0, neckY);
    ctx.stroke();

    /* 头：一圈 */
    ctx.beginPath();
    ctx.arc(0, headY, 8.2, 0, TAU);
    ctx.stroke();

    /* 眼睛一点 */
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(3.4, headY - 1, 1.1, 0, TAU); ctx.fill();

    /* 红缨：两根短线随风摆 */
    ctx.strokeStyle = acc;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-6.2, headY - 4.5);
    ctx.quadraticCurveTo(-13, headY - 9 + sway, -17.5, headY - 3 + sway * 1.6);
    ctx.stroke();

    /* 腰带 */
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(-5.5, hipY + 3);
    ctx.lineTo(5.5, hipY + 3);
    ctx.stroke();

    /* 手臂：前手随踢腿向后甩 */
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.1;
    var shoulderY = neckY + 3;
    ctx.beginPath();
    ctx.moveTo(0, shoulderY);
    ctx.quadraticCurveTo(7, shoulderY + 6, 13 - 6 * k, hipY - 2 - 10 * k);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, shoulderY);
    ctx.quadraticCurveTo(-7, shoulderY + 7, -12 - 5 * k, hipY - 1 + 6 * k);
    ctx.stroke();

    /* 支撑腿 */
    ctx.beginPath();
    ctx.moveTo(0, hipY);
    ctx.quadraticCurveTo(-3, hipY + 17, -7, -1);
    ctx.stroke();

    /* 踢出的那条腿：抬到接近水平 */
    var fx = 9 + 19 * k;
    var fy = -1 - 27 * k;
    ctx.beginPath();
    ctx.moveTo(0, hipY);
    ctx.quadraticCurveTo(5 + 8 * k, hipY + 15 - 4 * k, fx, fy);
    ctx.stroke();

    /* 脚掌 */
    if (k > 0.15) {
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(fx - 2, fy);
      ctx.lineTo(fx + 5, fy - 1);
      ctx.stroke();
    }

    ctx.restore();
    ctx.lineCap = 'butt';
  }

  /* 踢腿幅度：0.36 秒内起落一次 */
  function kickAmp(t) {
    if (!t || t <= 0) return 0;
    var p = 1 - t / 0.36;
    return Math.sin(Math.PI * clamp(p, 0, 1));
  }

  /* 一朵火苗：外焰朱砂，内焰暖橙，随时间抖 */
  function drawFlame(x, y, h, w, alpha, seed) {
    var t = st.t * 8.5 + (seed || 0);
    var sway = Math.sin(t) * 0.16;
    var flick = 0.88 + 0.12 * Math.sin(t * 1.9 + 1.3);
    var hh = h * flick;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(sway * 0.5);

    var g = ctx.createRadialGradient(0, hh * 0.22, 1, 0, hh * 0.18, hh * 0.95);
    g.addColorStop(0, 'rgba(240,164,80,0.95)');
    g.addColorStop(0.45, 'rgba(205,92,52,0.82)');
    g.addColorStop(1, 'rgba(184,69,58,0)');
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.moveTo(-w, hh * 0.42);
    ctx.quadraticCurveTo(-w * 1.5, -hh * 0.28, 0, -hh);
    ctx.quadraticCurveTo(w * 1.5, -hh * 0.28, w, hh * 0.42);
    ctx.quadraticCurveTo(0, hh * 0.92, -w, hh * 0.42);
    ctx.closePath();
    ctx.fill();

    /* 内焰 */
    ctx.fillStyle = 'rgba(252,228,172,0.85)';
    ctx.beginPath();
    ctx.moveTo(-w * 0.45, hh * 0.32);
    ctx.quadraticCurveTo(-w * 0.6, -hh * 0.1, 0, -hh * 0.62);
    ctx.quadraticCurveTo(w * 0.6, -hh * 0.1, w * 0.45, hh * 0.32);
    ctx.quadraticCurveTo(0, hh * 0.68, -w * 0.45, hh * 0.32);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* 烧到木牌：火星往上窜 */
  function burnBurst(x, y) {
    for (var i = 0; i < 14; i++) {
      var a = -Math.PI / 2 + rand(-1.1, 1.1);
      var sp = rand(50, 170);
      bits.push({
        x: x + rand(-12, 12), y: y + rand(-6, 8),
        vx: Math.cos(a) * sp * 0.55, vy: Math.sin(a) * sp,
        r: rand(1.4, 3.4), life: rand(0.35, 0.8), max: 0.8,
        c: Math.random() < 0.5 ? 'rgba(238,158,74,0.9)' : 'rgba(205,92,52,0.85)'
      });
    }
  }

  function drawZhaoyun() {
    var x = zyX, y = fieldY - 2;
    var br = Math.sin(st.t * 1.7) * 1.0;
    ctx.save();
    ctx.translate(x, y + br);
    drawWarrior({
      ink: 'rgba(52,58,62,0.86)',
      accent: 'rgba(184,69,58,0.92)'
    }, kickAmp(st.kickT));
    ctx.restore();
  }

  function drawFoeGeneral() {
    if (!foe) return;
    var x = foeX, y = fieldY - 2;
    var br = Math.sin(st.t * 1.5 + 1) * 1.0;
    /* 破关时淡出、微微后仰；新一关从半透明淡入 */
    var a = 1;
    if (foe.deadT > 0) a = clamp(foe.deadT / 0.95, 0, 1);
    else if (foe.fadeT > 0) a = 1 - clamp(foe.fadeT / 0.5, 0, 1) * 0.55;
    if (foe.hitT > 0) x += Math.sin(st.t * 62) * 2.6;
    ctx.globalAlpha = a;
    ctx.save();
    ctx.translate(x, y + br);
    ctx.rotate((1 - a) * -0.16);
    ctx.scale(-1, 1);   /* 镜像：面朝左 */
    drawWarrior({
      ink: 'rgba(58,62,66,0.9)',
      accent: 'rgba(110,114,120,0.9)'
    }, kickAmp(foe.kickT));
    ctx.restore();

    /* 敌将血条 */
    var bw = Math.min(70, W * 0.2), bh = 4;
    var bx = x - bw / 2, by = y - 96;
    ctx.fillStyle = 'rgba(80,90,94,0.16)';
    ctx.fillRect(bx, by, bw, bh);
    var ratio = clamp(foe.hp / foe.maxHp, 0, 1);
    ctx.fillStyle = ratio > 0.5 ? 'rgba(88,126,96,0.75)'
      : (ratio > 0.22 ? 'rgba(186,148,68,0.8)' : 'rgba(184,69,58,0.85)');
    ctx.fillRect(bx, by, bw * ratio, bh);

    /* 拼字过程：字母逐个亮起 */
    if (foe.state === 'spelling' && foe.target) {
      var letters = [foe.target.s];
      if (foe.target.m) letters.push(foe.target.m);
      letters.push(foe.target.y);
      var prog = clamp(foe.spellT / foe.spellDur, 0, 1);
      var shown = Math.min(letters.length, Math.floor(prog * letters.length) + 1);
      var txt = '';
      for (var i = 0; i < letters.length; i++) {
        txt += (i < shown ? letters[i] : '？');
        if (i < letters.length - 1) txt += ' · ';
      }
      ctx.font = '600 13px -apple-system,"PingFang SC",serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(184,69,58,0.8)';
      ctx.fillText(txt, x, y - 110);
      /* 进度细线 */
      ctx.strokeStyle = 'rgba(184,69,58,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 26, y - 102);
      ctx.lineTo(x - 26 + 52 * prog, y - 102);
      ctx.stroke();
    } else {
      ctx.font = '10px -apple-system,"PingFang SC",serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(90,94,100,0.55)';
      ctx.fillText('敌 将', x, y - 108);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlaques() {
    for (var i = 0; i < plaques.length; i++) {
      var pl = plaques[i];
      var bob = Math.sin(st.t * 4 + pl.seed) * 2.4;
      var x = pl.x, y = pl.y + bob;
      var flash = pl.hitT > 0 && Math.floor(st.t * 30) % 2 === 0;
      if (pl.dying) ctx.globalAlpha = clamp(pl.dieT / 0.75, 0, 1);

      ctx.fillStyle = 'rgba(96,106,108,0.10)';
      ctx.beginPath(); ctx.ellipse(x, pl.y + 34, 17, 3.6, 0, 0, TAU); ctx.fill();

      /* 挂绳 */
      ctx.strokeStyle = 'rgba(90,94,100,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y - 30);
      ctx.lineTo(x, y - 40);
      ctx.stroke();

      /* 木牌 */
      ctx.save();
      ctx.translate(x, y);
      if (pl.boss) ctx.rotate(Math.sin(st.t * 2.4 + pl.seed) * 0.05);
      ctx.fillStyle = flash ? '#f3d9cf' : '#f3ead8';
      ctx.strokeStyle = pl.boss ? 'rgba(184,69,58,0.8)' : 'rgba(90,94,100,0.75)';
      ctx.lineWidth = 1.5;
      var w = pl.boss ? 50 : 44, h = pl.boss ? 60 : 54;
      roundRect(-w / 2, -h / 2 - 4, w, h, 8);
      ctx.fill(); ctx.stroke();

      /* 每被烧一次，底部多一块焦痕 */
      var scorch = pl.scorch || 0;
      if (scorch > 0) {
        ctx.save();
        roundRect(-w / 2, -h / 2 - 4, w, h, 8);
        ctx.clip();
        ctx.globalAlpha = Math.min(0.5, 0.2 * scorch);
        ctx.fillStyle = 'rgba(62,46,38,0.9)';
        for (var sc = 0; sc < scorch; sc++) {
          var scx = -w * 0.26 + (sc % 3) * w * 0.26;
          ctx.beginPath();
          ctx.ellipse(scx, h / 2 - 5, w * 0.27, 9 + sc * 1.4, 0, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = '#3a3a38';
      ctx.font = 'bold ' + (pl.boss ? 24 : 22) + 'px -apple-system,"PingFang SC",serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pl.target.c, 0, pl.boss ? -9 : -8);

      ctx.fillStyle = '#8a6538';
      ctx.font = '11px -apple-system,"PingFang SC",serif';
      ctx.fillText(pl.target.p, 0, pl.boss ? 14 : 12);

      if (pl.boss) {
        ctx.fillStyle = 'rgba(184,69,58,0.9)';
        ctx.font = 'bold 9px -apple-system,"PingFang SC",serif';
        ctx.fillText('— 令 牌 —', 0, -h / 2 - 2);
      }
      if (pl.maxHp === 2 && pl.hp === 1) {
        ctx.strokeStyle = 'rgba(90,70,50,0.6)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-w / 2 + 6, -14);
        ctx.lineTo(-2, -2);
        ctx.lineTo(-8, 8);
        ctx.stroke();
      }

      /* 被字火烧到：底部暖光 + 两侧火苗 + 火星上窜 */
      if (pl.burnT > 0) {
        var ba = clamp(pl.burnT / 0.9, 0, 1);

        var wg = ctx.createRadialGradient(0, h / 2, 2, 0, h / 2, w * 1.1);
        wg.addColorStop(0, 'rgba(240,164,80,' + (0.42 * ba).toFixed(2) + ')');
        wg.addColorStop(1, 'rgba(205,92,52,0)');
        ctx.fillStyle = wg;
        ctx.beginPath();
        ctx.ellipse(0, h / 2 + 4, w * 0.95, h * 0.6, 0, 0, TAU);
        ctx.fill();

        drawFlame(-w * 0.44, h / 2 + 2, 24, 9, ba * 0.9, pl.seed);
        drawFlame(w * 0.42, h / 2 + 2, 20, 8, ba * 0.85, pl.seed + 3.1);
        drawFlame(0, h / 2 + 3, 15, 7, ba * 0.6, pl.seed + 5.4);

        for (var em = 0; em < 3; em++) {
          var emY = h / 2 - ((st.t * 46 + em * 17 + pl.seed * 10) % 46);
          ctx.globalAlpha = ba * 0.7;
          ctx.fillStyle = 'rgba(238,158,74,0.95)';
          ctx.beginPath();
          ctx.arc(-w * 0.3 + em * w * 0.3 + Math.sin(st.t * 9 + em) * 3, emY, 1.7, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      ctx.restore();
      ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawShots() {
    for (var i = 0; i < shots.length; i++) {
      var s = shots[i];
      var k = clamp(s.t / s.dur, 0, 1);
      var x = s.x + (s.tx - s.x) * k;
      var y = s.y + (s.ty - s.y) * k - Math.sin(k * Math.PI) * 44;
      var seed = s.seed || 0;

      /* 拖尾火星：前几帧的位置留 3 点残火 */
      for (var e = 0; e < 3; e++) {
        var tp = clamp(k - 0.05 * (e + 1), 0, 1);
        var ex = s.x + (s.tx - s.x) * tp;
        var ey = s.y + (s.ty - s.y) * tp - Math.sin(tp * Math.PI) * 44;
        ctx.globalAlpha = 0.42 - e * 0.12;
        ctx.fillStyle = e === 0 ? 'rgba(238,158,74,0.95)' : 'rgba(205,92,52,0.85)';
        ctx.beginPath();
        ctx.arc(ex + Math.sin(st.t * 13 + e * 2) * 3, ey + e * 5, 3.2 - e * 0.7, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      /* 火苗本体：字就是火焰的心 */
      drawFlame(x, y + 14, 42, 16, 0.95, seed);
      drawFlame(x + Math.sin(st.t * 6 + seed) * 3, y + 12, 26, 9, 0.55, seed + 2);

      /* 字：纸色描边压在火上，保证在浅底和火焰上都看得清 */
      ctx.save();
      ctx.font = 'bold 27px -apple-system,"PingFang SC",serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3.6;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255,252,244,0.9)';
      ctx.strokeText(s.ch, x, y - 1);
      ctx.fillStyle = '#2f2b28';
      ctx.fillText(s.ch, x, y - 1);
      ctx.restore();
    }
    ctx.textBaseline = 'alphabetic';
  }

  /* 中间对撞：我方字从左边撞上去，敌将的字在中间碎掉 */
  function drawClashes() {
    for (var i = 0; i < clashes.length; i++) {
      var cl = clashes[i];
      var k = clamp(cl.t / cl.dur, 0, 1);
      var cx = cl.x, cy = cl.y;
      var hitK = clamp(k / 0.32, 0, 1);
      var fade = k < 0.78 ? 1 : (1 - (k - 0.78) / 0.22);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      /* 冲击环 */
      if (k > 0.18) {
        var rk = clamp((k - 0.18) / 0.82, 0, 1);
        ctx.strokeStyle = 'rgba(198,164,104,' + (0.7 * (1 - rk)).toFixed(2) + ')';
        ctx.lineWidth = 5 * (1 - rk) + 0.6;
        ctx.beginPath(); ctx.arc(cx, cy, 14 + rk * 94, 0, TAU); ctx.stroke();
        ctx.strokeStyle = 'rgba(184,69,58,' + (0.42 * (1 - rk)).toFixed(2) + ')';
        ctx.lineWidth = 2 * (1 - rk) + 0.4;
        ctx.beginPath(); ctx.arc(cx, cy, 8 + rk * 58, 0, TAU); ctx.stroke();
      }

      /* 敌将的字：从右侧被撞进来，撞上即碎 */
      if (cl.foeWord) {
        var ek = clamp(k / 0.34, 0, 1);
        ctx.globalAlpha = (1 - ek) * 0.85;
        ctx.font = 'bold 26px -apple-system,"PingFang SC",serif';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,252,244,0.8)';
        ctx.strokeText(cl.foeWord, cx + 26 + (1 - ek) * 46, cy - 2);
        ctx.fillStyle = 'rgba(94,98,102,0.9)';
        ctx.fillText(cl.foeWord, cx + 26 + (1 - ek) * 46, cy - 2);
      }

      /* 我方字：从左侧冲入中点，撞上后微微放大再缩 */
      var cs = cl.word.split('');
      var n = cs.length;
      var slide = (1 - hitK) * -78;
      var scale = 0.72 + hitK * 0.42 - Math.max(0, k - 0.36) * 0.42;
      var gap = n >= 4 ? 25 : 30;
      for (var j = 0; j < n; j++) {
        var off = (j - (n - 1) / 2) * gap;
        var x = cx + off + slide;
        var y = cy + Math.sin(st.t * 30 + j) * (1 - hitK) * 3;
        ctx.globalAlpha = fade;
        ctx.font = 'bold ' + Math.round((n >= 4 ? 23 : 27) * scale) + 'px -apple-system,"PingFang SC",serif';
        ctx.lineWidth = 3.4;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(255,252,244,0.92)';
        ctx.strokeText(cs[j], x, y);
        ctx.fillStyle = k < 0.34 ? '#8a6538' : '#b8453a';
        ctx.fillText(cs[j], x, y);
      }

      /* 军阶标签 */
      ctx.globalAlpha = fade * 0.92;
      ctx.font = '9.5px -apple-system,"PingFang SC",serif';
      ctx.fillStyle = 'rgba(138,101,56,0.92)';
      ctx.fillText(cl.rank + ' 出 战 · ' + cl.dmg + ' 伤', cx, cy + 36);
      ctx.restore();
    }
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }

  function drawBits() {
    for (var i = 0; i < bits.length; i++) {
      var b = bits[i];
      ctx.globalAlpha = Math.max(0, b.life / b.max);
      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* =====================================================================
     十三、流程
     ===================================================================== */
  var startScreen = document.getElementById('startScreen');
  var overScreen = document.getElementById('overScreen');
  var clearScreenEl = document.getElementById('clearScreen');

  /* 关间战报：胜利/败北都要停一停，让孩子看见自己的状态，手动决定继续 */
  var pendingTier = 1;
  function showClearScreen(lvCleared, gotTitle, prevTier) {
    if (st.mode !== MODE.PLAY) return;
    st.mode = MODE.INTER;
    pendingTier = prevTier;
    /* 竞态保护：玩家恰好开着选字面板时收兵，先把面板收干净 */
    closeLadder();
    sel = [];
    st.lock = false;
    renderGrid(false);
    bannerEl.classList.remove('on');
    document.getElementById('csTag').textContent =
      '第 ' + lvCleared + ' 关 · 胜' + (gotTitle ? ' · 获封常胜将军' : '');
    document.getElementById('csStreak').textContent = st.streak;
    var lvlChars = runChars.slice(st.levelStart);
    var uniq = [];
    for (var i = lvlChars.length - 1; i >= 0; i--) {
      if (uniq.indexOf(lvlChars[i]) < 0) uniq.push(lvlChars[i]);
    }
    document.getElementById('csStat').innerHTML =
      '剩余 <span>' + st.hearts + '</span> 点血 · 本关拼出 <span>' + lvlChars.length + '</span> 个字' +
      (st.streak < 5 ? '<br>再赢 ' + (5 - st.streak) + ' 场，封「常胜将军」' : '<br>常胜将军 · 保持住');
    var rc = document.getElementById('csChars');
    rc.innerHTML = '';
    uniq.reverse().slice(0, 12).forEach(function (c) {
      var sp = document.createElement('span');
      sp.textContent = c;
      rc.appendChild(sp);
    });
    tipEl.textContent = '休整一下 · 点「下一关」继续';
    clearScreenEl.classList.remove('hide');
    updateHud();
  }

  document.getElementById('nextBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    SND.tap();
    clearScreenEl.classList.add('hide');
    st.mode = MODE.PLAY;
    st.levelStart = runChars.length;
    nextLevel(pendingTier);
  });

  function startGame() {
    audioInit();
    st.mode = MODE.PLAY;
    st.score = 0; st.hearts = 3; st.level = 1;
    st.shake = 0; st.flash = 0; st.gold = 0; st.lock = false; st.elapsed = 0;
    st.combo = 0; st.maxCombo = 0; st.clearing = false; st.failT = 0;
    st.streak = 0; st.levelStart = 0;
    /* 手速档案每局重测：不同孩子、不同心情，速度都不一样 */
    st.playT = 0; st.lastChar = -1;
    speedLog = []; skillVal = -1;
    rebuildTier(st.level);
    chars = []; shots = []; bits = []; plaques = []; clashes = [];
    runChars = [];
    myCells = [null, null, null, null];
    newLearned = [];
    missT = 0;
    closeLadder();
    bannerEl.classList.remove('on');
    comboEl.classList.remove('on');
    wrap.classList.remove('lowlife');
    wrap.classList.remove('dimhud');
    startScreen.classList.add('hide');
    overScreen.classList.add('hide');
    clearScreenEl.classList.add('hide');
    charlistEl.innerHTML = '';
    renderMyGrid(null);
    spawnFoe();
    updateHud();
    fullReset();
    tipEl.textContent = '字母拼出音节 · 声调对上才是那个字';
  }

  var VERDICTS = [
    { max: 2, t: '第一阵就退下来，不丢人。', s: '先记住一句：先定调，再出字。声调对了，字自己就浮出来了。' },
    { max: 5, t: '守住了开头，手已经热了。', s: '这几关的木牌最慢，下一局你只会更快。' },
    { max: 9, t: '打到这儿，已经不是新手了。', s: '木牌越来越快，你也在变快——这就叫练出来了。' },
    { max: 14, t: '最难的一段，你硬顶下来了。', s: '生僻字开始认脸了，下次见面就是熟人。' },
    { max: 999, t: '老将水平。', s: '木牌都不够你烧的，这局已经能教别人了。' }
  ];
  function verdictOf(lv) {
    for (var i = 0; i < VERDICTS.length; i++) if (lv <= VERDICTS[i].max) return VERDICTS[i];
    return VERDICTS[VERDICTS.length - 1];
  }

  function gameOver() {
    st.mode = MODE.OVER;
    st.lock = true;
    st.failT = 0;
    SND.over();
    closeLadder();
    bannerEl.classList.remove('on');
    wrap.classList.remove('lowlife');
    wrap.classList.add('dimhud');
    var isNew = st.score > best;
    if (isNew) {
      best = st.score;
      try { localStorage.setItem('pzqb_best', String(best)); } catch (e) {}
    }
    var reached = st.level;
    document.getElementById('finalScore').textContent = st.score;
    document.getElementById('bestOver').textContent = best;
    document.getElementById('bestStart').textContent = best;
    document.getElementById('learnStart').textContent = learnedCount();
    document.getElementById('newRec').classList.toggle('on', isNew);
    document.getElementById('overTag').textContent = isNew ? '新 纪 录' : '守 城 失 守';
    document.getElementById('overLv').textContent = '战 到 第 ' + reached + ' 关' +
      (st.title ? ' · ' + st.title : '');
    var newCount = newLearned.length;
    document.getElementById('overStat').innerHTML =
      '连胜 <span>' + st.streak + '</span> 场 · 拼出 <span>' + st.score + '</span> 个字' +
      '<br>' + (newCount > 0 ? ('这一局新学 <span>' + newCount + '</span> 个字 · ') : '') +
      '累计已学 <span>' + learnedCount() + '</span> 字';

    var v = verdictOf(reached);
    document.getElementById('overVerdict').textContent = v.t;
    document.getElementById('overVerdictS').textContent = v.s;
    document.getElementById('overCombo').textContent =
      (st.bestStreak >= 2 ? '最 高 连 胜 ' + st.bestStreak + ' 场' : '') +
      (st.maxCombo >= 2 ? (st.bestStreak >= 2 ? ' · ' : '') + '最 高 连 击 ×' + st.maxCombo : '');

    var rc = document.getElementById('runChars');
    rc.innerHTML = '';
    var uniq = [];
    for (var i = runChars.length - 1; i >= 0 && uniq.length < 12; i--) {
      if (uniq.indexOf(runChars[i]) < 0) uniq.push(runChars[i]);
    }
    if (uniq.length) {
      var lab = document.createElement('div');
      lab.style.cssText = 'width:100%;font-size:10px;letter-spacing:3px;color:#a8a292;margin-bottom:2px';
      lab.textContent = '这 一 局 拼 出 的 字';
      rc.appendChild(lab);
      uniq.reverse().forEach(function (c) {
        var sp = document.createElement('span');
        sp.textContent = c;
        rc.appendChild(sp);
      });
    }

    overScreen.classList.remove('hide');
  }

  document.getElementById('startBtn').addEventListener('click', function (e) {
    e.stopPropagation(); startGame();
  });
  document.getElementById('againBtn').addEventListener('click', function (e) {
    e.stopPropagation(); startGame();
  });

  /* 节奏开关：慢慢打 / 正常速度 */
  var paceRow = document.getElementById('paceRow');
  function paintPace() {
    Array.prototype.forEach.call(paceRow.children, function (b) {
      var isSlow = b.getAttribute('data-pace') === 'slow';
      b.classList.toggle('on', isSlow === slowPace);
    });
  }
  Array.prototype.forEach.call(paceRow.children, function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      slowPace = b.getAttribute('data-pace') === 'slow';
      try { localStorage.setItem(PACE_KEY, slowPace ? '1' : '0'); } catch (err) {}
      paintPace();
      SND.tap();
    });
  });
  paintPace();

  var lastMs = 0;
  function frame(ms) {
    if (!lastMs) lastMs = ms;
    var dt = (ms - lastMs) / 1000;
    lastMs = ms;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { resize(); });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 160); });

  resize();
  renderMyGrid(null);
  renderFoeGrid(null);
  updateHud();
  document.getElementById('bestStart').textContent = best;
  document.getElementById('learnStart').textContent = learnedCount();
  requestAnimationFrame(frame);

  /* 自检钩子：只有地址栏带 ?dev 才会挂上去，正常玩不受影响 */
  if (/[?&]dev\b/.test(location.search)) {
    window.__pt = {
      DB: DB, HOMO: HOMO, TONE_TBL: TONE_TBL,
      toneOf: toneOf, bareOf: bareOf, toneGroups: toneGroups,
      ensureLetters: ensureLetters, cards: function () { return cards.map(function (c) { return c ? c.v : null; }); },
      targets: TARGETS.length, slow: function () { return slowPace; },
      targetsNow: function () { return TARGETS.length; },
      homo: function () { return HOMO; },
      sampleTargets: function (n) {
        var out = [];
        for (var i = 0; i < n; i++) { var w = pickTarget(); if (w) out.push({ c: w.c, p: w.p, tri: !!w.m, s: w.s, m: w.m || '', y: w.y }); }
        return out;
      },
      inG12: function (c) { return !!KID[c]; },
      rankOf: function (c) { return rankOf(c); },
      spawnsTotal: function () { return spawnTotal; },
      setHearts: function (n) { st.hearts = n; updateHud(); },
      clearNow: function () { if (!foe) return false; foe.hp = 1; damageFoe(1, foeX, fieldY - 60, true); return true; },
      combo: function () { return st.combo; },
      maxCombo: function () { return st.maxCombo; },
      clearing: function () { return st.clearing; },
      failT: function () { return st.failT; },
      forceLeak: function () {
        for (var i = 0; i < plaques.length; i++) {
          if (!plaques[i].dying) { plaques[i].x = guardX + 12; return true; }
        }
        return false;
      },
      loseHeart: function () { loseHeart(); },
      overShown: function () { return !overScreen.classList.contains('hide'); },
      overText: function () {
        return [document.getElementById('overTag').textContent,
          document.getElementById('overLv').textContent,
          document.getElementById('overVerdict').textContent].join(' / ');
      },
      bannerText: function () {
        return bannerEl.classList.contains('on') ? (bannerMain.textContent + '|' + bannerSub.textContent) : '';
      },
      runChars: function () { return runChars.join(''); },
      streak: function () { return st.streak; },
      bestStreak: function () { return st.bestStreak; },
      title: function () { return st.title; },
      hpMax: function () { return HP_MAX; },
      clashes: function () { return clashes.length; },
      putMyChars: function (arr) {
        myCells = [null, null, null, null];
        arr.forEach(function (c, i) { if (i < 4) myCells[i] = { ch: c, p: '' }; });
        renderMyGrid(null);
        return myCells.map(function (c) { return c ? c.ch : '·'; }).join('');
      },
      addChar: function (c) { addMyChar({ c: c, p: '' }); },
      idiom: function (a, b, c, d) { return findIdiom([{ ch: a }, { ch: b }, { ch: c }, { ch: d }]); },
      wordCheck: function (a, b) { return !!(WORD_SET[a + b] || WORD_SET[b + a]); },
      clashNow: function () { clashAt('营长', '白云', 2, '半'); },
      hurt: function (n) { loseHeart(n || 1); },
      inter: function () { return st.mode === MODE.INTER; },
      feedEntry: function () { return wordFeedEntry([]) ? wordFeedEntry([]).c : null; },
      forceNewWave: function () { newWave(); },
      setLevelStart: function (n) { st.levelStart = n; },
      heartsMode: function () { return wrap.className; },
      clearField: function () { plaques.length = 0; },
      pools: function () { buildPools(); return { r1: POOL[1].length, r2: POOL[2].length, r3: POOL[3].length }; },
      inG34: function (c) { return !!G34[c]; },
      updateHud: updateHud,
      tier: function () { return tierOf(st.level); },
      tierLabel: function () { return tierLabel(st.level); },
      targetChars: function () { return TARGETS.map(function (w) { return w.c; }).join(''); },
      g34Targets: function () { return TARGETS_G34.length; },
      topTargets: function () { return TARGETS_TOP.length; },
      stage: function () { return st.level; },
      setLevel: function (n) { st.level = n; rebuildTier(n); },
      homoChars: function () {
        var n = 0; Object.keys(HOMO).forEach(function (k) { n += HOMO[k].length; });
        return n;
      },
      plaques: function () { return plaques.map(function (q) { return q.target.c + q.target.p + '@' + Math.round(q.x); }); },
      pushPlaque: function (w) { if (foe) spawnPlaque(w); },
      foeObj: function () { return foe; },
      simHit: function () {
        var best = null;
        for (var i = 0; i < plaques.length; i++) {
          var q = plaques[i];
          if (!q.dying && (!best || q.x < best.x)) best = q;
        }
        if (!best) return false;
        best.dying = true; best.dieT = 0.6;
        st.score++;
        damageFoe(1, best.x, best.y, true);
        return true;
      },
      hearts: function () { return st.hearts; },
      elapsed: function () { return st.elapsed; },
      /* 手速匹配自检 */
      skill: function () { return skillNow(); },
      skillRaw: function () { return skillVal; },
      speedLog: function () { return speedLog.slice(); },
      matchMul: function () { return levelSpeedMul(); },
      matchLabel: function () { return matchLabel(); },
      feedSkill: function (sec) { skillNote(sec); updateHud(); },
      setPlayT: function (v) { st.playT = v; },
      damage: function (n) { damageFoe(n, 0, 0, false); },
      plaqueWords: function () {
        return plaques.map(function (q) {
          return { c: q.target.c, p: q.target.p, s: q.target.s, m: q.target.m || '', y: q.target.y };
        });
      },
      foeState: function () { return foe ? foe.state + ':' + (foe.target ? foe.target.c : '-') : 'none'; },
      plaque: function (ch) {
        for (var i = 0; i < DB.length; i++) {
          if (DB[i].c === ch) { spawnPlaque(DB[i]); return DB[i].p; }
        }
        return null;
      },
      ladder: function (key) {
        var arr = HOMO[key] || [];
        for (var i = 0; i < arr.length; i++) {
          var w = { c: arr[i].c, p: arr[i].p };
          var parts = key.split('|'), s = null, y = null, m = null;
          parts.forEach(function (p) {
            var k = kindOf(p);
            if (k === 's') s = p; else if (k === 'm') m = p; else y = p;
          });
          if (!s) return null;
          w.s = s; w.y = y || s; if (m) w.m = m;
          openLadder(w);
          return w.p;
        }
        return null;
      }
    };
  }
})();
</script>
</body>
