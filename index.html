<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8f5ec">
<title>拼字奇兵</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#e9e4d6;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;
    background:#f8f5ec;touch-action:manipulation;box-shadow:0 0 90px rgba(0,0,0,.9)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;padding:13px 15px;z-index:6;
    display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  #hearts{display:flex;gap:5px}
  #left{display:flex;flex-direction:column;gap:6px}
  #matchTag{font-size:9px;letter-spacing:1.6px;color:#8a8578;font-weight:700;
    opacity:0;transition:opacity .35s}
  #matchTag.on{opacity:1}
  #matchTag.hot{color:#b8453a}
  .heart{width:20px;height:18px;transition:transform .3s,opacity .3s}
  .heart.gone{opacity:.2;transform:scale(.8)}
  #right{text-align:right}
  #score{font-size:26px;font-weight:900;color:#3a3a38;line-height:1}
  #meta{font-size:9.5px;letter-spacing:2px;color:#8a8578;margin-top:5px}
  #titleTag{font-size:9.5px;letter-spacing:2px;color:#a97a2f;margin-top:4px;font-weight:800;
    opacity:0;transition:opacity .3s}
  #titleTag.on{opacity:1}

  /* ---------- 双方字格（镜像） ---------- */
  #duelBand{position:absolute;left:0;right:0;top:40%;height:26%;z-index:6;pointer-events:none}
  .fgrid{position:absolute;top:0;bottom:0;width:18%;display:flex;flex-direction:column;gap:5px}
  #myGrid{left:30%}
  #foeGrid{right:30%}
  .fcell{flex:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1.3px dashed rgba(120,130,125,.28);background:rgba(255,255,255,.4);transition:background .25s}
  .fcell .zh{font-size:21px;font-weight:800;line-height:1.1}
  .fcell .py{font-size:9px;color:#9a9484;margin-top:1px}
  #myGrid .fcell.full{border-style:solid;border-color:#cbb391;background:#fffdf7}
  #myGrid .fcell.full .zh{color:#8a6538}
  #foeGrid .fcell{border-color:rgba(90,94,98,.3);background:rgba(236,233,226,.5)}
  #foeGrid .fcell.full{border-style:solid;border-color:#a9a396;background:#e9e5dc}
  #foeGrid .fcell.full .zh{color:#3a3a38}
  .fcell.pop{animation:cellIn .35s ease-out}
  .fcell.boom{animation:boomOut .5s forwards}
  @keyframes cellIn{from{transform:scale(.4);opacity:0}}
  @keyframes boomOut{40%{transform:scale(1.25)}100%{transform:scale(.3);opacity:0}}
  .fgridLabel{position:absolute;top:-16px;font-size:9px;letter-spacing:2px;color:#9a9484}
  #myGrid .fgridLabel{left:2px}
  #foeGrid .fgridLabel{right:2px}

  /* ---------- 拼读预览 ---------- */
  #pv{position:absolute;left:31%;right:31%;top:52%;transform:translateY(-50%);
    text-align:center;pointer-events:none;z-index:6}
  #pvText{display:inline-block;font-size:17px;font-weight:700;letter-spacing:2px;
    color:#5f6f68;opacity:0;transition:opacity .15s}
  #pvText.on{opacity:1}
  #pvText b{color:#b8453a}

  /* ---------- 8 格字母卡（缩小版） ---------- */
  #gridWrap{position:absolute;left:13px;right:13px;top:68.5%;bottom:16%;z-index:6}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
    gap:7px;width:100%;height:100%}
  .cell{position:relative;border-radius:12px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .12s,box-shadow .18s,background .2s;
    border:1.3px dashed rgba(120,130,125,.30);background:rgba(255,255,255,.5)}
  .cell.empty{pointer-events:none}
  .cell .lb{font-size:21px;font-weight:800;letter-spacing:.5px;line-height:1}
  .cell.two .lb{font-size:17px}
  .cell.three .lb{font-size:14px}
  .cell .kx{position:absolute;top:3px;right:6px;font-size:8px;letter-spacing:1px;opacity:.65}
  .cell.s{background:linear-gradient(160deg,#eaf2f5,#dce9ee);border:1.3px solid rgba(110,150,165,.55)}
  .cell.s .lb,.cell.s .kx{color:#3f6273}
  .cell.m{background:linear-gradient(160deg,#f1ebf3,#e5dbe9);border:1.3px solid rgba(160,130,170,.5)}
  .cell.m .lb,.cell.m .kx{color:#6b5573}
  .cell.y{background:linear-gradient(160deg,#f9f0e3,#f2e5d4);border:1.3px solid rgba(190,155,110,.55)}
  .cell.y .lb,.cell.y .kx{color:#8a6538}
  .cell.sel{transform:translateY(-4px) scale(1.04);
    box-shadow:0 0 0 2.5px #b8453a,0 8px 22px rgba(184,69,58,.20)}
  .cell.bad{animation:shk .34s}
  @keyframes shk{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}
    48%{transform:translateX(5px)}72%{transform:translateX(-3px)}}
  .cell.pop{animation:popOut .28s forwards}
  @keyframes popOut{to{transform:scale(.4);opacity:0}}
  .cell.drop{animation:dropIn .3s ease-out}
  @keyframes dropIn{from{transform:translateY(-22px) scale(.85);opacity:0}}

  /* ---------- 底部 ---------- */
  #bottom{position:absolute;left:0;right:0;bottom:0;height:16%;z-index:6;padding:0 14px;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(248,245,236,.98) 45%,rgba(248,245,236,0));
    pointer-events:none}
  #charlist{display:flex;gap:6px;justify-content:center;margin-bottom:7px;flex-wrap:wrap}
  .chip{font-size:14px;font-weight:700;color:#4a4a46;background:rgba(120,130,125,.10);
    border:1px solid rgba(120,130,125,.28);border-radius:8px;padding:2px 8px}
  .chip.new{animation:chipIn .4s;color:#b8453a;border-color:rgba(184,69,58,.45)}
  @keyframes chipIn{from{transform:scale(.5);opacity:0}}
  #tip{font-size:10.5px;letter-spacing:2px;color:#9a9484;text-align:center;height:14px}

  /* ---------- 同音字阶梯 ---------- */
  #ladder{position:absolute;inset:0;z-index:18;display:none;background:rgba(238,233,220,0.55)}
  #ladder.on{display:block}
  #ladderPanel{position:absolute;left:5%;right:5%;top:16%;background:#fffdf7;
    border:1.5px solid #d8cfba;border-radius:16px;padding:20px 16px 14px;text-align:center;
    box-shadow:0 24px 60px rgba(70,58,32,.22)}
  #lKey{font-size:22px;font-weight:800;color:#3a3a38;letter-spacing:1px}
  #lKey b{color:#b8453a}
  #lSub{margin-top:7px;font-size:11.5px;color:#9a9484;letter-spacing:1.5px}
  #lOpts{display:flex;gap:6px;margin-top:16px;align-items:flex-start;justify-content:center;
    flex-wrap:wrap;min-height:76px}
  .lOpt{flex:1 1 56px;max-width:74px;background:#fbf8f1;border:1.5px solid #e0dac9;border-radius:12px;
    padding:13px 0 9px;cursor:pointer;text-align:center;transition:transform .12s,border-color .15s}
  .lOpt:active{transform:scale(.93)}
  .lOpt .zh{font-size:25px;font-weight:800;color:#8a6538;line-height:1.1}
  .lOpt .py{font-size:10.5px;color:#9a9484;margin-top:4px;letter-spacing:1px}
  .lOpt.bad{animation:shk .34s;border-color:#b8453a}
  .lOpt.good{border-color:#b8453a;background:#f7e8e4;animation:glow 1s ease-in-out infinite}
  /* 声调条：先定调，再出字 */
  #lTones{display:flex;gap:7px;margin-top:14px;justify-content:center}
  .tChip{flex:1 1 0;max-width:86px;background:#fbf8f1;border:1.5px solid #e0dac9;border-radius:10px;
    padding:7px 0 5px;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
  .tChip .tpy{display:block;font-size:15px;font-weight:800;color:#8a6538;letter-spacing:.5px}
  .tChip .tno{display:block;font-size:9px;color:#b3aa96;margin-top:2px;letter-spacing:1px}
  .tChip.on{background:#f7e8e4;border-color:#b8453a}
  .tChip.on .tpy{color:#b8453a}
  .tChip.on .tno{color:#b8453a}
  .tChip:active{transform:scale(.93)}
  #lToneHint{margin-top:9px;font-size:10.5px;color:#b8453a;letter-spacing:1px;height:14px}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(184,69,58,0)}50%{box-shadow:0 0 0 3px rgba(184,69,58,.22)}}
  #lCancel{margin-top:13px;border:0;background:transparent;color:#9a9484;font-size:11px;
    letter-spacing:3px;padding:6px 18px;cursor:pointer;font-family:inherit}

  /* ---------- 字将 ---------- */
  #general{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .2s}
  #general.on{opacity:1}
  #general .gname{font-size:40px;font-weight:900;color:#3a3a38;letter-spacing:6px;
    text-shadow:0 0 30px rgba(184,69,58,.45),0 0 70px rgba(184,69,58,.25)}
  #general .gword{margin-top:8px;font-size:15px;letter-spacing:8px;color:#b8453a}
  #general .gburst{position:absolute;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(206,146,112,.38),rgba(184,69,58,.14) 42%,transparent 68%);
    animation:gburst .7s ease-out forwards}
  @keyframes gburst{from{transform:scale(.3);opacity:1}to{transform:scale(1.9);opacity:0}}

  /* ---------- 情绪横幅 / 连击 / 残血 ---------- */
  #banner{position:absolute;left:0;right:0;top:24%;z-index:16;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .24s}
  #banner.on{opacity:1}
  #banner .bMain{font-size:33px;font-weight:900;letter-spacing:7px;line-height:1.22;
    color:#b8453a;text-shadow:0 2px 0 rgba(255,252,244,.92),0 0 26px rgba(184,69,58,.26)}
  #banner.on .bMain{animation:bnPop .5s cubic-bezier(.18,.9,.24,1)}
  @keyframes bnPop{0%{transform:scale(.72);opacity:0}58%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
  #banner .bSub{margin-top:11px;font-size:11.5px;letter-spacing:3px;color:#8b8474;
    background:rgba(255,252,244,.86);padding:5px 13px;border-radius:20px;
    border:1px solid rgba(180,168,142,.5)}
  #banner.win .bMain{color:#a97a2f;text-shadow:0 2px 0 rgba(255,252,244,.95),0 0 30px rgba(206,164,96,.55)}
  #banner.win .bSub{color:#8a6538;border-color:rgba(206,178,120,.62)}
  #banner.bad .bMain{color:#8f2f28}

  #comboTag{position:absolute;left:50%;top:8.4%;transform:translateX(-50%) scale(.8);
    z-index:7;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;
    font-size:10px;letter-spacing:2px;color:#b8453a;background:rgba(247,232,228,.95);
    border:1px solid rgba(184,69,58,.4);border-radius:20px;padding:4px 12px;white-space:nowrap}
  #comboTag.on{opacity:1;transform:translateX(-50%) scale(1)}
  #comboTag b{font-size:15px;font-weight:900;margin-left:1px;color:#b8453a}
  #comboTag.pop b{display:inline-block;animation:cpop .3s}
  @keyframes cpop{0%{transform:scale(1.9)}100%{transform:scale(1)}}
  #score.pop{animation:scorePop .3s}
  @keyframes scorePop{0%{transform:scale(1.45);color:#b8453a}100%{transform:scale(1)}}

  #wrap.dimhud #hud{opacity:.22}
  #hud{transition:opacity .4s}
  #wrap.lowlife::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;
    box-shadow:inset 0 0 70px rgba(184,69,58,.34);animation:lowb 1.25s ease-in-out infinite}
  @keyframes lowb{0%,100%{opacity:.4}50%{opacity:.95}}

  /* ---------- 覆盖屏 ---------- */
  .screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:32px 26px;
    background:radial-gradient(120% 85% at 50% 30%,rgba(248,245,236,.94),rgba(243,239,229,.98));
    transition:opacity .35s}
  .screen.hide{opacity:0;pointer-events:none}
  .eyebrow{font-size:9.5px;letter-spacing:7px;color:#9a9484;margin-bottom:15px}
  h1{font-size:34px;font-weight:900;color:#3a3a38;line-height:1.3;letter-spacing:2px}
  h1 em{font-style:normal;color:#b8453a}
  .sub{margin-top:11px;font-size:13px;line-height:1.95;color:#6f6a5e;max-width:290px}
  .sub b{color:#b8453a}
  .sub .k{display:inline-block;background:rgba(220,233,238,.96);color:#3f6273;
    border-radius:6px;padding:0 6px;margin:0 2px;font-weight:700;font-size:12px}
  .sub .k2{background:rgba(249,240,227,.96);color:#8a6538}
  .best{margin-top:9px;font-size:11.5px;color:#9a9484;letter-spacing:1px}
  .grades{margin-top:11px;font-size:10.5px;color:#a8a292;letter-spacing:.2px}
  .pace{display:flex;gap:8px;margin-top:11px}
  .pbtn{border:1.5px solid #d8cfba;background:#fbf8f1;color:#9a9484;font-family:inherit;
    font-size:11.5px;padding:7px 15px;border-radius:20px;letter-spacing:1px;cursor:pointer;
    transition:background .15s,border-color .15s}
  .pbtn.on{background:#f7e8e4;border-color:#b8453a;color:#b8453a;font-weight:700}
  .pbtn:active{transform:scale(.95)}
  .best b{color:#3a3a38;font-size:14px;margin-left:5px}
  .btn{margin-top:16px;border:0;cursor:pointer;font-family:inherit;padding:15px 48px;border-radius:40px;
    font-size:15px;font-weight:800;letter-spacing:3px;color:#ffffff;
    background:linear-gradient(135deg,#c9584a,#a83b32);
    box-shadow:0 10px 30px rgba(184,69,58,.32),inset 0 -2px 0 rgba(0,0,0,.15);
    transition:transform .12s}
  .btn:active{transform:scale(.95)}
  .hint{position:absolute;bottom:22px;left:0;right:0;font-size:10px;color:#b3ad9c;letter-spacing:2px}
  .big{font-size:58px;font-weight:900;color:#3a3a38;line-height:1;letter-spacing:-2px}
  .unit{font-size:11.5px;color:#9a9484;letter-spacing:3px;margin-top:9px}
  .newrec{display:none;margin-top:12px;font-size:10.5px;letter-spacing:4px;color:#b8453a}
  .newrec.on{display:block}
  .stat{margin-top:16px;font-size:12px;color:#6f6a5e;line-height:2}
  .stat span{color:#b8453a;font-weight:700}
  .overLv{font-size:12px;letter-spacing:5px;color:#8b8474;margin-bottom:11px}
  .verdict{margin-top:15px;font-size:14px;font-weight:800;color:#3a3a38;letter-spacing:1px}
  .verdictS{margin-top:6px;font-size:11.5px;color:#8b8474;letter-spacing:.4px;max-width:290px;line-height:1.8}
  .runchars{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:13px;max-width:300px}
  .runchars span{font-size:13px;font-weight:700;color:#6f6a5e;background:rgba(120,130,125,.09);
    border:1px solid rgba(120,130,125,.22);border-radius:7px;padding:2px 7px}
  .comboBest{margin-top:10px;font-size:11px;letter-spacing:2px;color:#b8453a}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="c"></canvas>

    <div id="hud">
      <div id="left">
        <div id="hearts"></div>
        <div id="matchTag"></div>
      </div>
      <div id="right">
        <div id="score">0</div>
        <div id="meta">第 1 关</div>
        <div id="titleTag"></div>
      </div>
    </div>

    <div id="duelBand">
      <div id="myGrid" class="fgrid"><div class="fgridLabel">我方字格</div></div>
      <div id="pv"><span id="pvText"></span></div>
      <div id="foeGrid" class="fgrid"><div class="fgridLabel">敌方字格</div></div>
    </div>

    <div id="gridWrap"><div id="grid"></div></div>

    <div id="bottom">
      <div id="charlist"></div>
      <div id="tip">字母拼出音节 · 声调对上才是那个字</div>
    </div>

    <div id="ladder">
      <div id="ladderPanel">
        <div id="lKey"></div>
        <div id="lSub"></div>
        <div id="lTones"></div>
        <div id="lToneHint"></div>
        <div id="lOpts"></div>
        <button id="lCancel">取 消</button>
      </div>
    </div>

    <div id="general">
      <div class="gburst"></div>
      <div class="gname">字将</div>
      <div class="gword">出 战</div>
    </div>

    <div id="banner"><div class="bMain"></div><div class="bSub"></div></div>
    <div id="comboTag"></div>

    <div class="screen" id="startScreen">
      <div class="eyebrow">长 坂 坡 · 赵 云 守 关</div>
      <h1>拼字奇兵<br><em>拼音对拼</em></h1>
      <p class="sub">对面的敌将也在拼字，<br>写着你拼的音的<b>木牌</b>会朝你走来。<br>
      用字母拼出那个音：<span class="k">b</span>+<span class="k2">an</span> = <b>bān</b><br>
      选对声调，挑出 <b>班·半·搬·爸</b> 里对的那个字<br>
      选对的字落进我方字格，凑成词，字将出战！</p>
      <div class="grades"><b style="color:#b8453a">3 条命 · 打空敌将血条就破一关 · 命用完收兵</b><br>1-5 关只管慢慢拼 · 6 关起对手照你的手速配 · 字从常用到生僻</div>
      <div class="best">已学<b id="learnStart">0</b>字 · 拼字最多<b id="bestStart">0</b>字</div>
      <div class="pace" id="paceRow">
        <button class="pbtn on" data-pace="slow">慢 慢 打</button>
        <button class="pbtn" data-pace="fast">正 常 速 度</button>
      </div>
      <button class="btn" id="startBtn">开 战</button>
    </div>

    <div class="screen hide" id="overScreen">
      <div class="eyebrow" id="overTag">守 城 失 守</div>
      <div class="overLv" id="overLv">第 1 关</div>
      <div class="big" id="finalScore">0</div>
      <div class="unit">个 字</div>
      <div class="newrec" id="newRec">新 纪 录</div>
      <div class="stat" id="overStat"></div>
      <div class="comboBest" id="overCombo"></div>
      <div class="verdict" id="overVerdict"></div>
      <div class="verdictS" id="overVerdictS"></div>
      <div class="runchars" id="runChars"></div>
      <div class="best">最高纪录<b id="bestOver">0</b></div>
      <button class="btn" id="againBtn">再 战 一 局</button>
    </div>

    <div class="screen hide" id="clearScreen">
      <div class="eyebrow" id="csTag">第 1 关 · 胜</div>
      <div class="big" id="csStreak">1</div>
      <div class="unit">连 胜 场 数</div>
      <div class="stat" id="csStat"></div>
      <div class="runchars" id="csChars"></div>
      <button class="btn" id="nextBtn">下 一 关</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     一、拼音字库
     s=声母  m=介母（三拼）  y=韵母  c=汉字  p=带调音节
     ===================================================================== */
  var DB = [
    /* ---------- 双拼 ---------- */
    { s: 'b', y: 'a', c: '八', p: 'bā' },
    { s: 'b', y: 'i', c: '笔', p: 'bǐ' },
    { s: 'b', y: 'ai', c: '白', p: 'bái' },
    { s: 'p', y: 'ao', c: '跑', p: 'pǎo' },
    { s: 'p', y: 'a', c: '爬', p: 'pá' },
    { s: 'm', y: 'a', c: '妈', p: 'mā' },
    { s: 'm', y: 'en', c: '门', p: 'mén' },
    { s: 'm', y: 'u', c: '木', p: 'mù' },
    { s: 'f', y: 'ei', c: '飞', p: 'fēi' },
    { s: 'f', y: 'eng', c: '风', p: 'fēng' },
    { s: 'd', y: 'a', c: '大', p: 'dà' },
    { s: 'd', y: 'i', c: '弟', p: 'dì' },
    { s: 'd', y: 'ong', c: '冬', p: 'dōng' },
    { s: 'd', y: 'u', c: '读', p: 'dú' },
    { s: 'd', y: 'eng', c: '灯', p: 'dēng' },
